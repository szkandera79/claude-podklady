<title>Nabídky REO R290</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap">
<style>
  /* Layout: hlavička s logem, přepínač modelů, pod ním souhrn cen vlevo a strany letáku vpravo (na telefonu pod sebou) */
  :root{
    --bg:#F6F9F7; --surface:#FFFFFF; --fg:#16201C; --muted:#5A675F; --line:#DCE6DF;
    --brand:#34A263; --brand-strong:#1E6A3D; --brand-tint:#E9F6EE; --amber:#F0C246; --on-amber:#2A1C02;
    --font:"Manrope","Avenir Next","Helvetica Neue",Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#0F1512; --surface:#18211C; --fg:#E8F0EB; --muted:#9DAEA4; --line:#2A3630;
    --brand:#4DBB7B; --brand-strong:#7FD3A2; --brand-tint:#1C2E24; --amber:#F0C246; --on-amber:#2A1C02; color-scheme:dark } }
  :root[data-theme="dark"]{
    --bg:#0F1512; --surface:#18211C; --fg:#E8F0EB; --muted:#9DAEA4; --line:#2A3630;
    --brand:#4DBB7B; --brand-strong:#7FD3A2; --brand-tint:#1C2E24; --amber:#F0C246; --on-amber:#2A1C02; color-scheme:dark }

  body{ background:var(--bg); color:var(--fg); font-family:var(--font); font-size:15px; line-height:1.5; }
  .wrap{ max-width:1180px; margin:0 auto; padding-block:24px 48px;
    padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }

  header{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .logo{ background:#fff; border-radius:10px; padding:8px 12px; display:inline-flex; }
  .logo img{ width:150px; display:block; }
  .sale{ background:var(--amber); color:var(--on-amber); font-weight:700; font-size:13px; padding:7px 14px; border-radius:999px; }
  h1{ font-size:clamp(26px,4vw,36px); line-height:1.1; font-weight:800; letter-spacing:-.02em; margin:22px 0 6px; text-wrap:balance; }
  .lead{ color:var(--muted); max-width:62ch; margin:0; }

  .tabs{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin:24px 0 20px; }
  .tab{ font:inherit; text-align:left; cursor:pointer; background:var(--surface); color:var(--fg);
    border:1.5px solid var(--line); border-radius:12px; padding:10px 14px; display:grid; gap:2px; }
  .tab b{ font-size:16px; } .tab span{ font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .tab[aria-selected="true"]{ border-color:var(--brand); background:var(--brand-tint); }
  .tab[aria-selected="true"] b{ color:var(--brand-strong); }
  .tab:focus-visible{ outline:3px solid var(--brand); outline-offset:2px; }

  .panel{ display:grid; grid-template-columns:340px minmax(0,1fr); gap:24px; align-items:start; }
  .summary{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px; display:grid; gap:16px; position:sticky; top:16px; }
  .eyebrow{ font-size:12px; letter-spacing:.14em; text-transform:uppercase; font-weight:700; color:var(--brand); }
  .price{ font-size:32px; font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
  .price small{ font-size:13px; font-weight:600; color:var(--muted); letter-spacing:0; }
  .fit{ color:var(--muted); font-size:14px; margin:0; }
  table{ width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; font-size:14px; }
  th{ text-align:left; font-size:12px; color:var(--muted); font-weight:600; padding:0 0 6px; }
  th.r, td.r{ text-align:right; }
  td{ padding:8px 0; border-top:1px solid var(--line); }
  td.r{ font-weight:700; white-space:nowrap; padding-left:10px; }
  .note{ font-size:12.5px; color:var(--muted); margin:0; }
  .pdf{ display:inline-flex; gap:8px; align-items:center; justify-content:center; background:var(--brand); color:#fff;
    text-decoration:none; font:inherit; font-weight:700; padding:11px 16px; border-radius:10px; border:0; cursor:pointer; }
  .pdf[disabled]{ opacity:.6; cursor:progress; }
  .pdf:focus-visible{ outline:3px solid var(--brand-strong); outline-offset:2px; }

  .pages{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
  .pages figure{ margin:0; display:grid; gap:6px; }
  .pages img{ width:100%; height:auto; display:block; border-radius:6px; background:#fff;
    box-shadow:0 1px 2px rgba(0,0,0,.08), 0 6px 18px rgba(0,0,0,.08); }
  .pages figcaption{ font-size:12.5px; color:var(--muted); }

  @media (max-width:900px){
    .panel{ grid-template-columns:minmax(0,1fr); }
    .summary{ position:static; }
  }
  @media (max-width:560px){
    .tabs{ grid-template-columns:repeat(2,minmax(0,1fr)); }
    .pages{ grid-template-columns:minmax(0,1fr); }
  }
</style>

<div class="wrap">
  <header>
    <span class="logo"><img src="logo-reo-heating.svg" alt="REO HEATING"></span>
    <span class="sale">Výprodej skladu · do vyprodání zásob</span>
  </header>
  <h1>Nabídky tepelných čerpadel REO R290</h1>
  <p class="lead">Nabídkové letáky pro modely RH030 až RH060. Každý leták má dvě strany A4: produkt s realizacemi
  a ceny sestav s orientační instalací. Všechny ceny jsou bez DPH.</p>

  <div class="tabs" role="tablist" aria-label="Model" id="tabs"></div>
  <section class="panel" id="panel" role="tabpanel"></section>
</div>

<script>
const kc = n => n.toLocaleString('cs-CZ').replace(/ /g, ' ') + ' Kč';
const AKU = 12000, TUV = 25000, DOPRAVA = 4500, INST_A = 45000, INST_B = 55000;
const MODELS = [
  { id:'rh030', name:'RH030', kw:8,  price:94900,  kicker:'Pro menší domy', fit:'Novostavby a menší domy do cca 200 m², tepelná ztráta cca 5–8 kW.' },
  { id:'rh040', name:'RH040', kw:12, price:104900, kicker:'Nejžádanější model', fit:'Domy s tepelnou ztrátou cca 7–10 kW.' },
  { id:'rh050', name:'RH050', kw:15, price:124900, kicker:'Pro větší domy', fit:'Větší domy s tepelnou ztrátou cca 9–13 kW.' },
  { id:'rh060', name:'RH060', kw:22, price:168900, kicker:'Pro velké domy', fit:'Velké domy s tepelnou ztrátou cca 13–19 kW, v kaskádě až 8 jednotek.' },
];

const tabs = document.getElementById('tabs'), panel = document.getElementById('panel');
MODELS.forEach(m => {
  const b = document.createElement('button');
  b.className = 'tab'; b.id = 'tab-' + m.id; b.setAttribute('role', 'tab');
  b.innerHTML = `<b>${m.name} · ${m.kw} kW</b><span>${kc(m.price)}</span>`;
  b.addEventListener('click', () => show(m.id, true));
  tabs.appendChild(b);
});

function show(id, push){
  const m = MODELS.find(x => x.id === id) || MODELS[1];
  tabs.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.id === 'tab-' + m.id));
  const aDod = m.price + AKU + DOPRAVA, bDod = m.price + AKU + TUV + DOPRAVA;
  panel.innerHTML = `
    <aside class="summary">
      <div>
        <div class="eyebrow">${m.kicker}</div>
        <div class="price">${kc(m.price)} <small>bez DPH</small></div>
        <p class="fit">${m.name} · ${m.kw} kW. ${m.fit}</p>
      </div>
      <table>
        <tr><th>Sestava</th><th class="r">Dodávka</th><th class="r">S instalací</th></tr>
        <tr><td>A · pouze vytápění</td><td class="r">${kc(aDod)}</td><td class="r">${kc(aDod + INST_A)}</td></tr>
        <tr><td>B · vytápění + TUV</td><td class="r">${kc(bDod)}</td><td class="r">${kc(bDod + INST_B)}</td></tr>
      </table>
      <p class="note">Dodávka = jednotka, AKU 100 l, u sestavy B navíc zásobník TUV 200 l, a doprava. Instalace je orientační.</p>
      <button class="pdf" type="button" id="dl" data-file="REO_HEATING_Letak_${m.name}.pdf">Stáhnout nabídku ${m.name} (PDF)</button>
      <p class="note" id="dlStatus" role="status"></p>
    </aside>
    <div class="pages">
      <figure><img src="img/${m.name}-1.jpg" alt="Leták ${m.name}, strana 1: produkt, parametry a realizace" loading="lazy"><figcaption>Strana 1 · produkt a realizace</figcaption></figure>
      <figure><img src="img/${m.name}-2.jpg" alt="Leták ${m.name}, strana 2: ceny sestav, servis a poptávka" loading="lazy"><figcaption>Strana 2 · ceny sestav a servis</figcaption></figure>
    </div>`;
  if (push) { try { history.replaceState(null, '', '#' + m.id); } catch (e) {} }
  const btn = document.getElementById('dl'), st = document.getElementById('dlStatus');
  btn.addEventListener('click', async () => {
    btn.disabled = true; st.textContent = 'Připravuji PDF…';
    try {
      const downloads = await downloadsReady;
      if (!downloads) { st.textContent = 'Stažení tu není k dispozici.'; return; }
      const res = await fetch('pdf/' + btn.dataset.file);
      if (!res.ok) throw { code: 'fetch' };
      await downloads.save({ filename: btn.dataset.file, data: await res.blob() });
      st.textContent = 'PDF předáno ke stažení.';
    } catch (e) {
      const c = e && e.code;
      st.textContent = c === 'declined' ? 'Stažení zrušeno.'
        : c === 'rate_limited' ? 'Jedno stažení už čeká na potvrzení, zkuste to za chvíli.'
        : 'PDF se nepodařilo stáhnout.';
    } finally { btn.disabled = false; }
  });
}
const downloadsReady = window.claude && window.claude.use ? window.claude.use('downloads') : Promise.resolve(null);
show((location.hash || '#rh040').slice(1), false);
</script>
