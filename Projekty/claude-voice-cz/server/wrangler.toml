name = "claude-voice-cz"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Nastavení, která lze měnit bez přeinstalace aplikace (po změně: npm run deploy).
[vars]
MODEL = "claude-opus-5-5"        # alternativy: claude-sonnet-5-5, claude-haiku-5-5
EFFORT = "low"                    # low | medium | high
MAX_TOKENS = "1500"               # strop délky jedné odpovědi
DAILY_TOKEN_LIMIT = "2000000"     # denní strop tokenů (vstup + výstup), poté server odmítá
GITHUB_REPO = "szkandera79/claude-podklady"  # textové zrcadlo ~/Claude (Projekty, REO, …) — scripts/sync_podklady.py
ELEVENLABS_VOICE = "bF7C2fCv7Zf30iT84wZ1"   # Jana – Warm, Confident Czech (knihovna ElevenLabs, vybráno 11. 10. 2026)
ELEVENLABS_TTS_MODEL = "eleven_flash_v2_5"
ELEVENLABS_STT_MODEL = "scribe_v1"
TTS_MONTHLY_CHARS = "55000"      # Starter: 30 000 kreditů, Flash = 0,5 kreditu/znak (rezerva); při vyčerpání aplikace přejde na hlas Apple
STT_MONTHLY_SECONDS = "3600"

# Úložiště pro počítání denní spotřeby. ID doplní instalační skript
# (npx wrangler kv namespace create USAGE).
[[kv_namespaces]]
binding = "USAGE"
id = "e314f1a278e9466ca312f015744f1d77"

# Tajné hodnoty se NEPÍŠÍ sem, ale příkazem `npx wrangler secret put <NAZEV>`:
#   ANTHROPIC_API_KEY  – klíč z console.anthropic.com
#   APP_TOKEN          – přístupový token aplikace (vygeneruje instalační skript)
#   GITHUB_TOKEN       – token GitHubu jen pro čtení repozitáře projektů (scripts/set-github-token.sh)
