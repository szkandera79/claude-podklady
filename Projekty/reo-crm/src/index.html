      driveList(fid, function(res){
        var b2 = byId("realFiles"); if(!b2) return;
        b2.innerHTML = res.err ? '<div class="warnline">' + esc(res.err) + "</div>"
          : (res.files.length ? fileRowsHTML(res.files) : '<div class="hintline">Složka je prázdná.</div>');
      });
      return;
    }
    return;
  }
  if(ui.ev){
    if(t.closest("#evSave")){
      var g = function(i){ var el = byId(i); return el ? el.value : ""; };
      evDraft.title = g("evTitle") || "Událost";
      evDraft.at = g("evAt"); evDraft.kind = g("evKind");
      evDraft.place = g("evPlace"); evDraft.note = g("evNote");
      evDraft.saved = true;
      doOpQuiet({t:"ev", v: evDraft});
      closeLead(); toast("Událost uložena."); return;
    }
    if(t.closest("#evDel")){
      doOpQuiet({t:"evDel", v: evDraft.id});
      closeLead(); toast("Událost smazána."); return;
    }
    return;
  }
  if(ui.client){
    if(t.closest("#mkInvClient")){
      var cl2 = clientByKey(ui.client);
      closeLead();
      if(cl2){
        var nv = newInvoice("faktura", null);
        nv.customer = {name:cl2.name, street:cl2.street, zip:cl2.zip, city:cl2.city,
                       country:"Česká republika", ico:cl2.ico, dic:cl2.dic,
                       email:cl2.emails[0] || "", tel:cl2.phones[0] || ""};
        nv.leadId = cl2.leadId || null;
        openInvoice(nv);
      }
      return;
    }
    var ivC = t.closest("[data-inv]");
    if(ivC){ var o1 = invoiceById(ivC.getAttribute("data-inv")); closeLead(); if(o1) openInvoice(o1); return; }
    var ldC = t.closest("[data-id]");
    if(ldC){ openLead(ldC.dataset.id); return; }
    return;
  }
  var id = curId(); if(!id) return;
  var cp = t.closest("[data-copy]");
  if(cp){
    var val = cp.getAttribute("data-copy");
    if(navigator.clipboard) navigator.clipboard.writeText(val).then(function(){ toast("Zkopírováno: " + val); },
      function(){ toast("Kopírování se nepovedlo."); });
    return;
  }
  var dc = t.closest("[data-del-cmt]");
  if(dc){ doOp({t:"cmt-", id:id, v:dc.getAttribute("data-del-cmt")}); return; }
  var dm = t.closest("[data-del-meet]");
  if(dm){ doOp({t:"meet-", id:id, v:dm.getAttribute("data-del-meet")}); return; }
  var tm = t.closest("[data-toggle-meet]");
  if(tm){
    var mid = tm.getAttribute("data-toggle-meet"), cur = null;
    (ovRead(id).meetings||[]).forEach(function(m){ if(m.id === mid) cur = m; });
    doOp({t:"meet", id:id, m:{id:mid, done: !(cur && cur.done)}});
    return;
  }
  var dt = t.closest("[data-del-tag]");
  if(dt){
    var tag = dt.getAttribute("data-del-tag");
    doOp({t:"set", id:id, k:"tags", v:(ovRead(id).tags||[]).filter(function(x){ return x !== tag; })});
    return;
  }
  if(t.closest("#addTag")){
    var ti = byId("tagInput");
    ti.classList.remove("hidden"); byId("addTag").classList.add("hidden"); ti.focus();
    return;
  }
  if(t.closest("#adoptNote")){
    var row = findRow(id);
    if(row && row.note){
      doOp({t:"cmt", id:id, c:{id:uid(), ts:nowISO(), author:(ME || "Z tabulky"), text:row.note}});
      toast("Poznámka ze sloupce U převzata.");
    }
    return;
  }
  /* --- nabídka e-mailem --- */
  if(t.closest("#mkInv") || t.closest("#mkZal")){
    var rowM = findRow(id);
    closeLead();
    openInvoice(newInvoice(t.closest("#mkZal") ? "zaloha" : "faktura", rowM));
    return;
  }
  var dRow = t.closest("[data-inv]");
  if(dRow){
    var ivD = invoiceById(dRow.getAttribute("data-inv"));
    if(ivD){ closeLead(); openInvoice(ivD); }
    return;
  }
  if(t.closest("#ofCopyBody")){
    var bodyEl = byId("ofBody");
    if(bodyEl) copyText(bodyEl.value, "Text e-mailu");
    return;
  }
  if(t.closest("#ofCopyAddr")){
    var rowA = findRow(id);
    if(rowA && rowA.email) copyText(rowA.email, "Adresa");
    return;
  }
  if(t.closest("#ofMark")){
    doOp({t:"set", id:id, k:"offer", v:{at: nowISO(), by: ME || "Já"}});
    var oNow = ovRead(id);
    if(["novy","nedovol","kontakt"].indexOf(oNow.stage) >= 0) doOp({t:"set", id:id, k:"stage", v:"nabidka"});
    toast("Zaznamenáno — nabídka odeslána.");
    return;
  }
  if(t.closest("#addCmt")){
    var box = byId("cmtText"); var txt = box ? box.value.trim() : "";
    if(!txt){ if(box) box.focus(); return; }
    drafts[id] = "";
    doOp({t:"cmt", id:id, c:{id:uid(), ts:nowISO(), author:(ME || "Já"), text:txt}});
    return;
  }
  if(t.closest("#addMeet")){
    var when = byId("mDate").value;
    if(!when){ byId("mDate").focus(); toast("Vyber datum a čas schůzky."); return; }
    doOp({t:"meet", id:id, m:{id:uid(), at:when, place:byId("mPlace").value.trim(),
      note:byId("mNote").value.trim(), done:false}});
    var o = ovRead(id);
    if(o.stage === "novy" || o.stage === "nedovol" || o.stage === "kontakt"){
      doOp({t:"set", id:id, k:"stage", v:"schuzka"});
    }
    toast("Schůzka naplánovaná.");
    return;
  }
});
on(byId("drawer"), "change", function(e){
  var id = curId(); if(!id) return;
  var el = e.target;
  if(el.id === "fdStage") doOp({t:"set", id:id, k:"stage", v:el.value});
  else if(el.id === "fdPrio") doOp({t:"set", id:id, k:"prio", v:Number(el.value)});
  else if(el.id === "fdOwner"){
    var w = el.value.trim();
    if(w && state.owners.indexOf(w) < 0) state.owners.push(w);
    doOp({t:"set", id:id, k:"owner", v:w});
  }
  else if(el.id === "fdDate" || el.id === "fdTask"){
    var d = byId("fdDate").value, x = byId("fdTask").value.trim();
    doOp({t:"set", id:id, k:"next", v:(d || x) ? {date:d, text:x} : null});
  }
});
on(byId("drawer"), "input", function(e){
  if(e.target.id === "cmtText" && curId()) drafts[curId()] = e.target.value;
  if(e.target.id === "ofSubj" || e.target.id === "ofBody"){
    var r = findRow(curId()), a = byId("ofOpen");
    if(r && a) a.setAttribute("href", mailtoUrl(r, byId("ofSubj").value, byId("ofBody").value));
  }
});
on(byId("drawer"), "keydown", function(e){
  if(e.target.id === "tagInput"){
    if(e.key === "Enter"){
      e.preventDefault();
      var v = e.target.value.trim(), id = curId();
      if(v && id){
        var list = (ovRead(id).tags||[]).slice();
        if(list.indexOf(v) < 0) list.push(v);
        doOp({t:"set", id:id, k:"tags", v:list});
      }
    } else if(e.key === "Escape"){
      e.target.classList.add("hidden"); byId("addTag").classList.remove("hidden");
    }
    return;
  }
  if(e.target.id === "cmtText" && (e.metaKey || e.ctrlKey) && e.key === "Enter"){
    e.preventDefault();
    var b = byId("addCmt"); if(b) b.click();
  }
});

/* ---------- editor faktury: události ---------- */
function handleInvEditorClick(e){
  if(!invDraft) return false;
  var t = e.target;
  if(t.closest("#invClose")){ closeInvoice(); return true; }
  if(t.closest("#invPrint")){ captureInvoice(); printInvoice(invDraft); return true; }
  if(t.closest("#invDownload")){ captureInvoice(); downloadInvoice(invDraft); return true; }
  if(t.closest("#invAddRow")){
    captureInvoice();
    invDraft.items.push({name:"", code:"", qty:1, unit:"ks", price:0, disc:0,
                         dph:(state.company || DEF_COMPANY).dph || 21});
    rerenderInvoice(); return true;
  }
  var del = t.closest("[data-del-item]");
  if(del){
    captureInvoice();
    invDraft.items.splice(parseInt(del.getAttribute("data-del-item"), 10), 1);
    rerenderInvoice(); return true;
  }
  if(t.closest("#invDelete")){
    var el = byId("invDelete");
    if(el.dataset.sure !== "1"){ el.dataset.sure = "1"; el.textContent = "Opravdu smazat?"; return true; }
    doOpQuiet({t:"invDel", v: invDraft.id});
    closeInvoice(); toast("Doklad smazán."); return true;
  }
  if(t.closest("#invPaid")){
    captureInvoice();
    invDraft.paid = !invDraft.paid;
    invDraft.paidAt = invDraft.paid ? nowISO() : null;
    rerenderInvoice(); return true;
  }
  if(t.closest("#invSave")){
    captureInvoice();
    var op = {t:"inv", v: invDraft};
    op.__save = 1;
    if(!invDraft.saved){
      var ser = JSON.parse(JSON.stringify(state.series || DEF_SERIES));
      invDraft.number = nextNumber(invDraft.type);
      invDraft.saved = true;
      invDraft.by = ME || (state.company || DEF_COMPANY).vystavil;
      ser[invDraft.type].next = (ser[invDraft.type].next || 1) + 1;
      op.series = ser;
    }
    doOpQuiet(op);
    rerenderInvoice();
    toast("Doklad " + invDraft.number + " uložen.");
    return true;
  }
  return false;
}

function handleInvEditorChange(e){
  if(!invDraft) return false;
  if(e.target.id === "invPl"){
    var i = parseInt(e.target.value, 10);
    if(!isNaN(i) && state.pricelist[i]){
      captureInvoice();
      var pl = state.pricelist[i];
      invDraft.items.push({name:pl.name, code:pl.code, qty:1, unit:pl.unit || "ks",
                           price:Number(pl.price) || 0, disc:0, dph:Number(pl.dph) || 21});
      rerenderInvoice();
    }
    return true;
  }
  if(!e.target.closest(".invbody")) return false;
  captureInvoice();
  rerenderInvoice();
  return true;
}

/* ---------- start ---------- */
function afterState(){
  if(pending.length){
    pending.forEach(function(p){ try{ applyOp(p); }catch(e){} });
    renderAll();
  }
  byId("meBtn").textContent = ME || "Já";
  renderAll();
  restorePlace();
  useCap("artifact").then(function(a){
    ART = a;
    if(!a){ readOnly = true; setSync("err", "Jen ke čtení");
      setBanner("ro", "warn", "Změny se v tomhle pohledu neuloží — dokument je otevřený jen ke čtení."); }
    else if(pending.length) scheduleSave();
  });
  useCap("downloads").then(function(d){ DL = d; byId("exportBtn").classList.toggle("hidden", !d); });
  useCap("mcp").then(function(m){ MCP = m; startSync(); });
  setInterval(function(){
    if(!saving && !dirty) setSync(syncErr ? "err" : (syncAt ? "ok" : "idle"), syncLabel());
  }, 60000);
}
function init(){
  state = normState(loadInline());
  byId("q").value = ui.q || "";
  renderAll();
  var done = false;
  var go = function(){ if(done) return; done = true; afterState(); };
  try{
    fetch("data/crm.json", {cache:"no-store"}).then(function(r){
      return r.ok ? r.json() : null;
    }).then(function(f){
      if(f && typeof f === "object" && (f.rev || 0) >= (state.rev || 0)) state = normState(f);
    }).catch(function(){}).then(go, go);
  }catch(e){ go(); }
  setTimeout(go, 4000);
}
init();
})();
</script>
