<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>Reo Heating CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style id="app-style">
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
:root{
  --bg:#F1F4F3; --surface:#FFFFFF; --surface-2:#F7F9F8; --surface-3:#EBEFEE;
  --line:#DBE2E0; --line-2:#C4CDCA;
  --ink:#12211E; --ink-2:#43534F; --ink-3:#6F817C;
  --accent:#0E7C86; --accent-2:#0A626A; --accent-soft:#DCEEF0; --on-accent:#FFFFFF;
  --heat:#C6491F; --heat-soft:#FAE7DF;
  --ok:#2C7A4B; --warn:#A9701A; --bad:#B03A2B;
  --s-novy:#6B8AA6; --s-nedov:#8C7BA6; --s-kontakt:#0E7C86; --s-schuzka:#2A8A69;
  --s-nabidka:#B7862A; --s-vyhrano:#C2461F; --s-ztraceno:#8C9591;
  --shadow-1:0 1px 2px rgba(18,33,30,.07);
  --shadow-2:0 2px 4px rgba(18,33,30,.06),0 12px 28px -14px rgba(18,33,30,.28);
  --r:9px;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --disp:"Archivo","IBM Plex Sans",-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1514; --surface:#141E1C; --surface-2:#1A2523; --surface-3:#22302D;
    --line:#26332F; --line-2:#374742;
    --ink:#E9EFED; --ink-2:#A8B7B2; --ink-3:#7B8B86;
    --accent:#3EAFB7; --accent-2:#57C3CA; --accent-soft:#0F3237; --on-accent:#04211F;
    --heat:#EE7B4E; --heat-soft:#361A11;
    --ok:#4FA974; --warn:#D6A045; --bad:#E2735F;
    --s-novy:#88A6C0; --s-nedov:#A99AC4; --s-kontakt:#3EAFB7; --s-schuzka:#4CB08B;
    --s-nabidka:#D6A845; --s-vyhrano:#EE7B4E; --s-ztraceno:#8C9591;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 2px 4px rgba(0,0,0,.3),0 12px 28px -14px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1514; --surface:#141E1C; --surface-2:#1A2523; --surface-3:#22302D;
  --line:#26332F; --line-2:#374742;
  --ink:#E9EFED; --ink-2:#A8B7B2; --ink-3:#7B8B86;
  --accent:#3EAFB7; --accent-2:#57C3CA; --accent-soft:#0F3237; --on-accent:#04211F;
  --heat:#EE7B4E; --heat-soft:#361A11;
  --ok:#4FA974; --warn:#D6A045; --bad:#E2735F;
  --s-novy:#88A6C0; --s-nedov:#A99AC4; --s-kontakt:#3EAFB7; --s-schuzka:#4CB08B;
  --s-nabidka:#D6A845; --s-vyhrano:#EE7B4E; --s-ztraceno:#8C9591;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 2px 4px rgba(0,0,0,.3),0 12px 28px -14px rgba(0,0,0,.8);
}
#app{position:relative;overflow-x:hidden}   /* zavřená zásuvka stojí mimo plochu, ať nedělá posuvník */
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::selection{background:var(--accent-soft);color:var(--ink)}

/* ---------- kostra se stromem ---------- */
.shell{display:flex;min-height:100vh;align-items:stretch}
.side{flex:0 0 224px;background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:45}
.side-head{display:flex;align-items:center;gap:10px;padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.side-head svg{flex:none;display:block}
.side-head b{font-family:var(--disp);font-weight:700;font-size:14.5px;letter-spacing:-.01em;display:block;line-height:1.15}
.side-head span{font-size:10.5px;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase}
.tree{flex:1;overflow-y:auto;padding:10px 8px 16px}
.tree .grp{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  padding:12px 10px 5px;font-weight:600}
.tree a{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:7px;
  text-decoration:none;color:var(--ink-2);font-size:13.5px;cursor:pointer;line-height:1.35}
.tree a:hover{background:var(--surface-2);color:var(--ink)}
.tree a[aria-current="true"]{background:var(--accent-soft);color:var(--accent-2);font-weight:600}
.tree a .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tree a[aria-current="true"] .cnt{color:var(--accent-2)}
.tree .kid{padding-left:26px;font-size:13px}
.tree .kid::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--line-2);flex:none;margin-left:-12px}
.tree a[aria-current="true"].kid::before{background:var(--accent-2)}
.side-foot{border-top:1px solid var(--line);padding:10px 12px}
.side-foot .sync{width:100%;justify-content:center}
.maincol{flex:1;min-width:0;display:flex;flex-direction:column}
.burger{display:none;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);
  width:32px;height:32px;border-radius:8px;cursor:pointer;align-items:center;justify-content:center;flex:none}
.crumb{font-family:var(--disp);font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.crumb small{display:block;font-family:var(--sans);font-size:11px;font-weight:400;color:var(--ink-3);letter-spacing:0}
.sidescrim{position:fixed;inset:0;background:rgba(10,20,18,.4);z-index:44;opacity:0;pointer-events:none;transition:opacity .16s}
.sidescrim.on{opacity:1;pointer-events:auto}
@media (max-width:860px){
  .side{position:fixed;left:0;top:0;bottom:0;transform:translateX(-102%);transition:transform .2s ease;box-shadow:var(--shadow-2)}
  .side.on{transform:none}
  .burger{display:flex}
}

/* ---------- chrome ---------- */
.topbar{
  position:sticky;top:0;z-index:38;background:var(--surface);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:10px 18px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none;display:block}
.brand b{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:-.01em;display:block;line-height:1.15}
.brand span{font-size:11px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.views{display:flex;gap:2px;background:var(--surface-3);padding:3px;border-radius:8px}
.views button{
  border:0;background:transparent;padding:6px 13px;border-radius:6px;cursor:pointer;
  font-weight:500;font-size:13px;color:var(--ink-2);white-space:nowrap;
}
.views button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.grow{flex:1 1 auto;min-width:120px}
.search{position:relative;flex:1 1 220px;max-width:340px}
.search input{
  width:100%;padding:8px 12px 8px 32px;border:1px solid var(--line);border-radius:8px;
  background:var(--surface-2);
}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.tb-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip-btn{
  display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:7px;
  border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:12.5px;color:var(--ink-2);
}
.chip-btn:hover{border-color:var(--line-2);color:var(--ink)}
.sync{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:7px;font-size:12.5px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);cursor:pointer}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none}
.sync[data-s="ok"] .dot{background:var(--ok)}
.sync[data-s="load"] .dot{background:var(--warn);animation:pulse 1.1s ease-in-out infinite}
.sync[data-s="err"] .dot{background:var(--bad)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- kpi ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:1px;
  background:var(--line);border-bottom:1px solid var(--line)}
.kpi{background:var(--surface);padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .n{font-family:var(--disp);font-weight:700;font-size:24px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.kpi .s{font-size:11.5px;color:var(--ink-3)}
.kpi.hot .n{color:var(--heat)}

/* ---------- toolbar ---------- */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 18px;
  border-bottom:1px solid var(--line);background:var(--surface-2)}
.toolbar label{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin-right:2px}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:5px 11px;cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-2);font-weight:500}
select.f,input.f{padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface);font-size:12.5px}
.linkish{background:none;border:0;color:var(--accent);cursor:pointer;font-size:12.5px;padding:4px 2px}
.newbadge{background:var(--heat-soft);color:var(--heat);border:1px solid transparent;font-weight:500}
.chip-btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-2);font-weight:500}
#meInput{width:130px;background:var(--surface)}
.taginput{padding:3px 10px;border:1px solid var(--accent);border-radius:20px;background:var(--surface);
  font-size:12px;width:150px}

/* ---------- board ---------- */
main{padding:16px 18px 60px}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.col{flex:0 0 268px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);
  display:flex;flex-direction:column;max-height:calc(100vh - 240px)}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.col-head{padding:9px 11px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;
  background:var(--surface-2);border-radius:var(--r) var(--r) 0 0;z-index:1}
.col.over .col-head{background:transparent}
.col-bar{height:3px;border-radius:2px;margin-bottom:8px;background:var(--sc)}
.col-head .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.col-head .t b{font-size:12.5px;font-weight:600;letter-spacing:.01em}
.col-head .t i{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.col-body{padding:8px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.col-empty{font-size:12px;color:var(--ink-3);padding:10px 4px;text-align:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;
  cursor:pointer;box-shadow:var(--shadow-1);display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--line-2);box-shadow:var(--shadow-2)}
.card.dragging{opacity:.45}
.card .nm{font-weight:600;font-size:13.5px;letter-spacing:-.005em;display:flex;gap:6px;align-items:center}
.card .nm .flame{color:var(--heat);flex:none}
.card .meta{font-size:11.5px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:4px 8px}
.card .meta .mono{font-family:var(--mono)}
.card .foot{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:20px;
  background:var(--surface-3);color:var(--ink-2);font-size:11px;white-space:nowrap}
.tag.due{background:var(--heat-soft);color:var(--heat)}
.tag.meet{background:var(--accent-soft);color:var(--accent-2)}
.tag.new{background:var(--heat);color:#fff}
.tag.own{background:transparent;border:1px solid var(--line-2);color:var(--ink-3)}

.card .notep{font-size:11.5px;color:var(--ink-2);background:var(--surface-2);
  border-left:2px solid var(--warn);border-radius:0 5px 5px 0;padding:4px 8px;line-height:1.45}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;
  cursor:pointer;box-shadow:var(--shadow-1);display:flex;flex-direction:column;gap:8px}
.pcard:hover{border-color:var(--line-2);box-shadow:var(--shadow-2)}
.pcard .ph{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pcard .ph b{font-family:var(--disp);font-size:15px;letter-spacing:-.01em;line-height:1.25}
.pcard .pcontact{font-size:12px;color:var(--ink-3);display:flex;flex-direction:column;gap:2px}
.pcard .pcontact span{font-family:var(--mono)}
.pregion{font-size:12.5px;background:var(--accent-soft);color:var(--accent-2);border-radius:6px;padding:5px 9px}
.pregion b{font-weight:600}
.pchips{display:flex;flex-wrap:wrap;gap:5px}
.pchips .c{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--line-2);color:var(--ink-2)}
.pchips .c.yes{border-color:transparent;background:var(--heat-soft);color:var(--heat)}
.pcard .pfoot{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;
  border-top:1px solid var(--line);padding-top:8px;margin-top:auto}
.sectionhead{display:flex;align-items:baseline;gap:12px;margin:0 0 14px;flex-wrap:wrap}
.sectionhead h2{font-family:var(--disp);font-size:17px;margin:0;letter-spacing:-.015em}
.sectionhead p{margin:0;font-size:12.5px;color:var(--ink-3);max-width:62ch}
/* ---------- table ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
.tablewrap table{min-width:940px}     /* jen datové tabulky aplikace, ne doklad */
th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:11px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);
  white-space:nowrap;cursor:pointer;z-index:2}
th:hover{color:var(--ink)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
td.mono{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
td.nm{font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11.5px;
  background:var(--surface-3);white-space:nowrap}
.pill .pd{width:6px;height:6px;border-radius:50%;background:var(--pc)}

/* ---------- agenda ---------- */
.agenda{display:grid;gap:18px;max-width:840px}
.agroup h3{font-family:var(--disp);font-size:13px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 8px;font-weight:600}
.agroup.overdue h3{color:var(--heat)}
.arow{display:grid;grid-template-columns:90px 1fr auto;gap:12px;align-items:center;padding:10px 12px;
  background:var(--surface);border:1px solid var(--line);border-radius:8px;cursor:pointer;margin-bottom:6px}
.arow:hover{border-color:var(--line-2)}
.arow .when{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.arow .who b{font-weight:600}
.arow .who div{font-size:12px;color:var(--ink-3)}
.empty{padding:44px 20px;text-align:center;color:var(--ink-3);background:var(--surface);
  border:1px dashed var(--line-2);border-radius:var(--r)}
.empty b{display:block;color:var(--ink);font-family:var(--disp);font-size:15px;margin-bottom:6px}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,20,18,.42);z-index:50;opacity:0;pointer-events:none;transition:opacity .16s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:absolute;top:0;right:0;width:min(520px,100%);background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r) 0 0 var(--r);z-index:60;
  transform:translateX(102%);transition:transform .2s ease;max-height:820px;
  display:flex;flex-direction:column;box-shadow:var(--shadow-2)}
.drawer.on{transform:none}
.dr-head{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dr-head h2{font-family:var(--disp);font-size:19px;margin:0 0 3px;letter-spacing:-.015em;text-wrap:balance}
.dr-head .sub{font-size:12px;color:var(--ink-3)}
.x{border:0;background:var(--surface-2);width:30px;height:30px;border-radius:7px;cursor:pointer;color:var(--ink-2);flex:none;font-size:16px;line-height:1}
.x:hover{background:var(--surface-3);color:var(--ink)}
.dr-body{overflow-y:auto;padding:16px 18px 40px;display:flex;flex-direction:column;gap:18px;max-height:740px}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick a,.quick button{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:7px;
  border:1px solid var(--line);background:var(--surface-2);text-decoration:none;color:var(--ink-2);font-size:12.5px;cursor:pointer}
.quick a:hover,.quick button:hover{border-color:var(--accent);color:var(--accent-2)}
.sect>h4{font-family:var(--disp);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 9px;font-weight:600;display:flex;align-items:center;gap:8px}
.sect>h4::after{content:"";flex:1;height:1px;background:var(--line)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px}
.field span{font-size:11px;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase}
.field input,.field select,.field textarea{padding:7px 9px;border:1px solid var(--line);border-radius:7px;
  background:var(--surface-2);width:100%}
.field textarea{resize:vertical;min-height:64px}
.answers{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.answers>div{background:var(--surface);padding:7px 10px;display:grid;grid-template-columns:minmax(120px,42%) 1fr;gap:10px;font-size:12.5px}
.answers .q{color:var(--ink-3)}
.answers .a{font-weight:500}
.sheetnote{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--warn);
  border-radius:6px;padding:8px 10px;font-size:12.5px;color:var(--ink-2)}
.sheetnote b{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
.thread{display:flex;flex-direction:column;gap:9px}
.cmt{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.cmt .h{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--ink-3);margin-bottom:4px}
.cmt .h b{color:var(--ink-2);font-weight:600}
.cmt p{margin:0;white-space:pre-wrap;font-size:13px}
.cmt .del{border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:11px;padding:0}

/* ---------- utils ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){

/* Oprava mojibake (UTF-8 přečtené jako latin-1) u emoji v odpovědích */
function fixMoji(s){
  if(!s || !/[\u00C2-\u00F4][\u0080-\u00BF]/.test(s)) return s;
  return s.replace(/[\u00C2-\u00F4][\u0080-\u00BF]{1,3}/g, function(m){
    try{
      var b = Uint8Array.from(m, function(c){ return c.charCodeAt(0); });
      return new TextDecoder("utf-8", {fatal:true}).decode(b);
    }catch(e){ return m; }
  });
}
function pretty(v){
  if(!v) return "";
  return String(v).split("|").map(function(x){
    return fixMoji(x).replace(/_/g," ").replace(/\s+/g," ").trim();
  }).filter(Boolean).map(function(x){
    return x.charAt(0).toUpperCase() + x.slice(1);
  }).join(" · ");
}
function label(q){
  var t = fixMoji(q).replace(/_/g," ").replace(/\s+/g," ").trim();
  return t.charAt(0).toUpperCase() + t.slice(1);
}
var MONTHS = ["led","úno","bře","dub","kvě","čvn","čvc","srp","zář","říj","lis","pro"];

function d2(n){ return n<10 ? "0"+n : ""+n; }
function fmtDate(d){ if(!d) return ""; return d.getDate()+". "+MONTHS[d.getMonth()]+" "+d.getFullYear(); }
function fmtShort(d){ if(!d) return ""; return d2(d.getDate())+"."+d2(d.getMonth()+1)+"."+String(d.getFullYear()).slice(2); }
function fmtTime(d){ return d2(d.getHours())+":"+d2(d.getMinutes()); }
function dayKey(d){ return d.getFullYear()+"-"+d2(d.getMonth()+1)+"-"+d2(d.getDate()); }
function relDays(iso){
  if(!iso) return null;
  var t = new Date(iso); if(isNaN(t)) return null;
  var a = new Date(); a.setHours(0,0,0,0);
  var b = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  return Math.round((b - a) / 86400000);
}
function relText(n){
  if(n === null) return "";
  if(n === 0) return "dnes";

  if(n < 0) return "před " + (-n) + " dny";

}

/* ---------- parsování markdown tabulek ze Sheetu ---------- */
function cellsOf(line){
  var parts = line.split(/(?<!\\)\|/);
  if(parts.length > 2){ parts = parts.slice(1, parts.length - 1); }
  return parts.map(function(p){
    return p.replace(/\\([|_*\[\]`~])/g, "$1").trim();
  });
}
function isSep(cells){
  return cells.length && cells.every(function(c){ return c === "" || /^:?-{2,}:?$/.test(c); });
}
function parseSheet(md){
  var out = [], blocks = String(md).split(/\n\s*\n/);
  blocks.forEach(function(block){
    var lines = block.split("\n").filter(function(l){ return l.trim().indexOf("|") === 0; });
    var rows = lines.map(cellsOf).filter(function(c){ return !isSep(c); });
    if(rows.length < 2) return;
    var hi = -1;
    for(var i=0;i<rows.length;i++){ if(rows[i].indexOf("id") >= 0 && rows[i].indexOf("created_time") >= 0){ hi = i; break; } }
    if(hi < 0) return;
    var head = rows[hi];
    for(var r = hi+1; r < rows.length; r++){
      var lead = normalize(head, rows[r]);
      if(lead) out.push(lead);
    }
  });
  return out;
}
function normalize(head, row){
  var L = { answers: [], sheetNotes: [] };
  for(var i=0;i<head.length;i++){
    var h = head[i], raw = (row[i] || "").trim();
    if(SKIP[h]) continue;
    var key = CORE[h];
    if(key){ L[key] = raw; continue; }
    var hl = h.toLowerCase();
    if(hl === "komentář - klient"){            /* sloupec U — hlavní poznámka k leadu */
      if(raw) L.note = fixMoji(raw);
      continue;
    }
    if(NOTES[hl]){
      if(raw) L.sheetNotes.push({ q: h ? label(h) : "Poznámka", a: fixMoji(raw) });
      continue;
    }
    if(raw) L.answers.push({ q: label(h), a: pretty(raw) });
  }
  if(!L.id) return null;
  L.id = L.id.replace(/^l:/, "");
  L.phone = (L.phone || "").replace(/^p:/, "").replace(/\s+/g, "");
  L.name = (L.name || "").trim();
  if(!L.name && !L.phone && !(L.email||"").trim()) return null;   /* prázdný řádek tabulky */
  if(!L.name) L.name = "Bez jména";
  L.email = (L.email || "").trim();
  L.city = (L.city || "").trim();
  L.form = L.form || "";
  L.segment = /partne/i.test(L.form + " " + (L.campaign||"") + " " + (L.ad||"")) ? "partner" : "zakaznik";
  var d = L.created ? new Date(L.created) : null;
  L.createdMs = (d && !isNaN(d)) ? d.getTime() : 0;
  return L;
}

/* ---------- čtení sešitu .xlsx přímo v prohlížeči ----------
   Textové čtení tabulky konektor ořezává zhruba na 96 tisících znacích,
   takže sešit stahujeme celý a rozbalujeme si ho sami. */
function b64bytes(str){
  var bin = atob(String(str).replace(/\s+/g, "")), n = bin.length, out = new Uint8Array(n);
  for(var i = 0; i < n; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function utf8(bytes){ return new TextDecoder("utf-8").decode(bytes); }
function xmlDoc(text){ return new DOMParser().parseFromString(text, "application/xml"); }

function zipEntries(buf){
  var dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  var i = buf.length - 22, min = Math.max(0, buf.length - 65558), found = -1;
  for(; i >= min; i--){ if(dv.getUint32(i, true) === 0x06054b50){ found = i; break; } }
  if(found < 0) throw new Error("zip-eocd");
  var count = dv.getUint16(found + 10, true), p = dv.getUint32(found + 16, true), map = {};
  for(var k = 0; k < count; k++){
    if(p + 46 > buf.length || dv.getUint32(p, true) !== 0x02014b50) break;
    var nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
    map[utf8(buf.subarray(p + 46, p + 46 + nlen))] = {
      method: dv.getUint16(p + 10, true),
      csize:  dv.getUint32(p + 20, true),
      lho:    dv.getUint32(p + 42, true)
    };
    p += 46 + nlen + elen + clen;
  }
  return map;
}
function entryData(buf, e){
  if(!e) return Promise.reject(new Error("zip-missing"));
  var dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  if(dv.getUint32(e.lho, true) !== 0x04034b50) return Promise.reject(new Error("zip-local"));
  var start = e.lho + 30 + dv.getUint16(e.lho + 26, true) + dv.getUint16(e.lho + 28, true);
  var raw = buf.subarray(start, start + e.csize);
  if(e.method === 0) return Promise.resolve(raw);
  if(e.method !== 8) return Promise.reject(new Error("zip-method"));
  if(typeof DecompressionStream === "undefined") return Promise.reject(new Error("nodecomp"));
  try{
    var st = new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return new Response(st).arrayBuffer().then(function(ab){ return new Uint8Array(ab); });
  }catch(err){ return Promise.reject(new Error("nodecomp")); }
}
var REL_NS = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";
function colIdx(ref){
  var n = 0;
  for(var i = 0; i < ref.length; i++){
    var c = ref.charCodeAt(i);
    if(c < 65 || c > 90) break;
    n = n * 26 + (c - 64);
  }
  return n - 1;
}
function sheetRows(text, sst){
  var doc = xmlDoc(text), rows = doc.getElementsByTagName("row"), out = [];
  for(var i = 0; i < rows.length; i++){
    var cs = rows[i].getElementsByTagName("c"), arr = [];
    for(var j = 0; j < cs.length; j++){
      var c = cs[j], idx = colIdx(c.getAttribute("r") || ""), t = c.getAttribute("t"), val = "", v;
      if(t === "s"){
        v = c.getElementsByTagName("v")[0];
        if(v) val = sst[parseInt(v.textContent, 10)] || "";
      } else if(t === "inlineStr"){
        var ts = c.getElementsByTagName("t");
        for(var k = 0; k < ts.length; k++) val += ts[k].textContent;
      } else {
        v = c.getElementsByTagName("v")[0];
        if(v) val = v.textContent;
      }
      if(idx >= 0){ while(arr.length < idx) arr.push(""); arr[idx] = val; }
    }
    out.push(arr);
  }
  return out;
}
function parseWorkbook(bytes){
  var ent = zipEntries(bytes);
  return Promise.all([
    entryData(bytes, ent["xl/workbook.xml"]).then(utf8),
    entryData(bytes, ent["xl/_rels/workbook.xml.rels"]).then(utf8),
    ent["xl/sharedStrings.xml"] ? entryData(bytes, ent["xl/sharedStrings.xml"]).then(utf8) : Promise.resolve("")
  ]).then(function(parts){
    var wb = xmlDoc(parts[0]), rels = xmlDoc(parts[1]), rmap = {}, sst = [];
    var rl = rels.getElementsByTagName("Relationship");
    for(var i = 0; i < rl.length; i++) rmap[rl[i].getAttribute("Id")] = rl[i].getAttribute("Target");
    if(parts[2]){
      var si = xmlDoc(parts[2]).getElementsByTagName("si");
      for(var a = 0; a < si.length; a++){
        var tt = si[a].getElementsByTagName("t"), txt = "";
        for(var b = 0; b < tt.length; b++) txt += tt[b].textContent;
        sst.push(txt);
      }
    }
    var shl = wb.getElementsByTagName("sheet"), sheets = [];
    for(var m = 0; m < shl.length; m++){
      var rid = shl[m].getAttributeNS(REL_NS, "id") || shl[m].getAttribute("r:id");
      var target = (rmap[rid] || "").replace(/^\/?(xl\/)?/, "");
      sheets.push({name: shl[m].getAttribute("name") || ("List " + (m + 1)), path: "xl/" + target});
    }
    return Promise.all(sheets.map(function(sh){
      if(!ent[sh.path]) return Promise.resolve({name: sh.name, rows: []});
      return entryData(bytes, ent[sh.path]).then(utf8).then(function(t){
        return {name: sh.name, rows: sheetRows(t, sst)};
      });
    }));
  });
}
function leadsFromWorkbook(sheets){
  var out = [];
  sheets.forEach(function(sh){
    var rows = sh.rows, hi = -1;
    for(var i = 0; i < rows.length && i < 6; i++){
      if(rows[i].indexOf("id") >= 0 && rows[i].indexOf("created_time") >= 0){ hi = i; break; }
    }
    if(hi < 0) return;
    var head = rows[hi].map(function(h){ return (h == null ? "" : String(h)).trim(); });
    for(var r = hi + 1; r < rows.length; r++){
      var L = normalize(head, rows[r]);
      if(!L) continue;
      L.sheet = sh.name;
      if(/partne/i.test(sh.name)) L.segment = "partner";
      out.push(L);
    }
  });
  return out;
}

function money(n){
  var v = Math.round((Number(n) || 0) * 100) / 100;
  try{ return v.toLocaleString("cs-CZ", {minimumFractionDigits:2, maximumFractionDigits:2}) + " Kč"; }
  catch(e){ return v.toFixed(2) + " Kč"; }
}
function num(n){
  var v = Number(n) || 0;
  try{ return v.toLocaleString("cs-CZ", {maximumFractionDigits:3}); }catch(e){ return String(v); }

function czDate(d){
  if(!d) return "";
  var t = (d instanceof Date) ? d : new Date(d);
  if(isNaN(t)) return "";
  return t.getDate() + "." + (t.getMonth() + 1) + "." + t.getFullYear();
}
function isoDate(d){
  var t = (d instanceof Date) ? d : new Date(d);
  return t.getFullYear() + "-" + d2(t.getMonth() + 1) + "-" + d2(t.getDate());
}
function addDays(iso, n){
  var t = new Date(iso); t.setDate(t.getDate() + n); return isoDate(t);
}
/* Výpočet jednoho řádku i celého dokladu — jediné místo, kde se počítá. */
function calcItem(it, pdp){
  var qty = Number(it.qty) || 0, price = Number(it.price) || 0;
  var disc = Number(it.disc) || 0, rate = Number(it.dph) || 0;
  var unitAfter = price * (1 - disc / 100);
  var base = Math.round(unitAfter * qty * 100) / 100;
  /* V režimu přenesené daňové povinnosti daň neúčtujeme — odvede ji odběratel. */
  var vat = pdp ? 0 : Math.round(base * rate / 100 * 100) / 100;
  return {
    unitAfter: unitAfter,
    listTotal: Math.round(price * qty * 100) / 100,
    base: base, rate: rate, vat: vat, total: Math.round((base + vat) * 100) / 100
  };
}
function calcDoc(inv){
  var pdp = !!inv.pdp;
  var items = (inv.items || []).map(function(it){
    var c = calcItem(it, pdp); c.it = it; return c;
  });
  var byRate = {}, base = 0, vat = 0, listSum = 0;
  items.forEach(function(c){
    base += c.base; vat += c.vat; listSum += c.listTotal;
    var k = String(c.rate);
    if(!byRate[k]) byRate[k] = {rate: c.rate, base: 0, vat: 0};
    byRate[k].base += c.base; byRate[k].vat += c.vat;
  });
  var rates = [];
  for(var k in byRate){
    byRate[k].total = Math.round((byRate[k].base + byRate[k].vat) * 100) / 100;
    rates.push(byRate[k]);
  }
  rates.sort(function(a, b){ return a.rate - b.rate; });
  base = Math.round(base * 100) / 100;
  vat = Math.round(vat * 100) / 100;
  return {
    items: items, rates: rates, base: base, vat: vat, pdp: pdp,
    listSum: Math.round(listSum * 100) / 100,
    discount: Math.round((listSum - base) * 100) / 100,
    total: Math.round((base + vat) * 100) / 100
  };
}
function nextNumber(type){
  var ser = (state.series && state.series[type]) || DEF_SERIES[type];
  var n = String(ser.next || 1);
  while(n.length < (ser.pad || 5)) n = "0" + n;
  return (ser.prefix || "") + n;
}

function firstName(full){
  return String(full || "").trim().split(/\s+/)[0] || "";
}
function noEmoji(t){
  try{ return String(t || "").replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{2B00}-\u{2BFF}]/gu, "").replace(/\s+/g, " ").trim(); }
  catch(e){ return String(t || "").replace(/[^\x00-\u2000]/g, "").replace(/\s+/g, " ").trim(); }
}
/* Nepravidelná jména. U čehokoliv, čím si nejsme jistí, oslovení raději vynecháme —
   „Dobrý den," je vždycky správně, „Dobrý den, Martin," ne. */
var VOC = {"petr":"Petře","pavel":"Pavle","karel":"Karle","zdeněk":"Zdeňku","havel":"Havle",
           "marcel":"Marceli","přemysl":"Přemysle","otakar":"Otakare","bohumil":"Bohumile"};
function vocative(name){
  var n = String(name || "").trim();
  if(n.length < 3 || /[0-9@._]/.test(n)) return null;
  if(n !== n.charAt(0).toUpperCase() + n.slice(1)) {
    n = n.charAt(0).toUpperCase() + n.slice(1).toLowerCase();
  }
  var low = n.toLowerCase();
  if(VOC[low]) return VOC[low];
  var last = low.charAt(low.length - 1);
  if(last === "a") return n.slice(0, -1) + "o";                    /* Jana → Jano */
  if(last === "e" || last === "í" || last === "i") return n;       /* Marie, Jiří */
  if("áéěyýoúůu".indexOf(last) >= 0) return null;                  /* Ivo, Hugo — necháme být */
  if(last === "k") return n + "u";                                 /* Marek → Marku */
  if("šžčřjďťň".indexOf(last) >= 0) return n + "i";                /* Tomáš → Tomáši */
  if(last === "c") return n + "i";                                 /* Vavřinec → Vavřinci */
  if(last === "h" || last === "g") return n + "u";                 /* Vojtěch → Vojtěchu */
  if(/[bcdfglmnprstvxz]$/.test(low)) return n + "e";               /* Martin → Martine */
  return null;
}
function greeting(r){
  var v = vocative(firstName(r.name));
  return v ? "Dobrý den, " + v + "," : "Dobrý den,";
}
function fillTemplate(text, r){
  var map = {
    "oslovení": greeting(r),
    "jméno": r.name || "",
    "křestní": vocative(firstName(r.name)) || firstName(r.name),
    "město": noEmoji(r.city) || "",
    "topí": noEmoji(heatOf(r)).toLowerCase() || "neuvedeno",
    "náklady": noEmoji(costOf(r)) || "neuvedeno",
    "termín": noEmoji(whenOf(r)).toLowerCase() || "neuvedeno",
    "telefon": r.phone || "",
    "email": r.email || ""
  };
  return String(text || "").replace(/\{\{\s*([^}]+?)\s*\}\}/g, function(m, key){
    var k = key.toLowerCase();
    return Object.prototype.hasOwnProperty.call(map, k) ? map[k] : m;
  });
}
function offerFor(r){
  var t = state.template || DEF_TEMPLATE;
  return {subject: fillTemplate(t.subject, r), body: fillTemplate(t.body, r)};

function mailtoUrl(r, subject, body){
  return "mailto:" + encodeURIComponent(r.email || "") +
    "?subject=" + encodeURIComponent(subject) +

}
function copyText(txt, label){
  function done(){ toast(label + " zkopírováno."); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, fallback);
  } else { fallback(); }
  function fallback(){
    try{
      var ta = document.createElement("textarea");
      ta.value = txt; ta.setAttribute("readonly", "");
      ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
      document.body.appendChild(ta); ta.select();
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      ok ? done() : toast("Kopírování se nepovedlo — označ text myší a zkopíruj ručně.");
    }catch(e){ toast("Kopírování se nepovedlo — označ text myší a zkopíruj ručně."); }
  }
}
function ovRead(id){ return state.leads[id] || DEFOV; }
function ovWrite(id){
  var o = state.leads[id];
  if(!o){
    o = {stage:"novy", owner:"", prio:0, tags:[], comments:[], meetings:[], next:null, seen:nowISO()};
    state.leads[id] = o;
  }
  if(!o.tags) o.tags = []; if(!o.comments) o.comments = []; if(!o.meetings) o.meetings = [];
  return o;
}
function isNew(id){ return !state.leads[id]; }

function baseRows(){
  var map = {}, out = [], k;
  var snap = (state.snapshot && state.snapshot.rows) || [];
  for(var i=0;i<snap.length;i++) map[snap[i].id] = snap[i];
  if(live) for(var j=0;j<live.length;j++) map[live[j].id] = live[j];
  for(k in map) if(Object.prototype.hasOwnProperty.call(map,k)) out.push(map[k]);
  out.sort(function(a,b){ return b.createdMs - a.createdMs; });
  return out;
}

/* ---------- odvozené hodnoty ---------- */
function answerBy(r, re){
  var a = r.answers || [];
  for(var i=0;i<a.length;i++) if(re.test(a[i].q)) return a[i].a;
  return "";
}
function heatOf(r){ return answerBy(r, /vytáp|topí/i); }
function costOf(r){ return answerBy(r, /kolik|platíte|náklad/i); }
function whenOf(r){ return answerBy(r, /kdy/i); }
function nextMeeting(o){
  var best = null;
  (o.meetings||[]).forEach(function(m){
    if(m.done || !m.at) return;
    if(!best || m.at < best.at) best = m;
  });
  return best;
}
function dueDate(o){ return (o.next && o.next.date) ? o.next.date : null; }
function isOverdue(o){
  var d = dueDate(o);
  if(d && relDays(d) < 0) return true;
  var m = nextMeeting(o);
  return !!(m && new Date(m.at) < new Date());
}
function commentCount(o){ return (o.comments||[]).length; }
function ownersList(){
  var s = {}, out = [];
  state.owners.forEach(function(o){ if(o) s[o]=1; });
  for(var id in state.leads){ var w = state.leads[id].owner; if(w) s[w] = 1; }
  for(var k in s) out.push(k);
  return out.sort();
}

  }

function filtered(){
  var rows = scoped();

    rows = rows.filter(function(r){
      var o = ovRead(r.id);
      var hay = [r.name, r.phone, r.email, r.city, r.campaign, r.form, r.ad, r.note || "", o.owner || "",
                 (o.tags||[]).join(" "), (r.answers||[]).map(function(a){return a.a;}).join(" "),
                 (o.comments||[]).map(function(c){return c.text;}).join(" ")].join(" ").toLowerCase();
      return hay.indexOf(q) >= 0;
    });

/* ---------- KPI ---------- */
function renderKpis(){
  var rows = scoped(), total = rows.length, fresh = 0, open = 0, won = 0, soon = 0, late = 0;
  var weekEnd = Date.now() + 7*86400000;
  rows.forEach(function(r){
    var o = ovRead(r.id);
    if(isNew(r.id)) fresh++;
    if(["kontakt","schuzka","nabidka"].indexOf(o.stage) >= 0) open++;
    if(o.stage === "vyhrano") won++;
    var m = nextMeeting(o);
    if(m){ var t = new Date(m.at).getTime(); if(t >= Date.now() && t <= weekEnd) soon++; }
    if(isOverdue(o)) late++;

  if(ui.view === "fakturace.odberatele" || ui.view === "kontakty"){
    var cl = buildClients();

      {n: money(sum), l: "Fakturováno", s: "vč. DPH, celkem"},
      {n: money(unpaid), l: "Nezaplaceno", s: unpaidN + " dokladů", hot: unpaid > 0},

    ].map(function(t){

             '<span class="l">' + esc(t.l) + '</span><span class="s">' + esc(t.s || "") + "</span></div>";
    }).join("");
    return;
  }
  if(ui.view === "leady.partneri"){
    var fplyn = 0, both = 0;
    rows.forEach(function(r){
      if(/^ano/i.test(pGas(r))) fplyn++;
      if(/montáž i servis/i.test(pForm(r))) both++;
    });
    byId("kpis").innerHTML = [
      {n: total, l: "Partnerů", s: "v databázi"},
      {n: fresh, l: "Neprověřených", s: fresh ? "nikdo se jim neozval" : "všichni prošli", hot: fresh > 0},
      {n: both,  l: "Montáž i servis", s: "kompletní služba"},
      {n: fplyn, l: "S F-plyny", s: "oprávnění na chlazení"},
      {n: won,   l: "Spolupracujeme", s: "aktivní partneři"}
    ].map(function(t){
      return '<div class="kpi' + (t.hot ? " hot" : "") + '"><span class="n">' + t.n + '</span>' +
             '<span class="l">' + esc(t.l) + '</span><span class="s">' + esc(t.s || "") + '</span></div>';
    }).join("");
    return;
  }
  if(!isLeadSection()){ byId("kpis").innerHTML = ""; return; }
  var tiles = [
    {n: total, l: "Leadů", s: "zákazníci"},
    {n: fresh, l: "Nezpracovaných", s: fresh ? "čeká na první kontakt" : "vše rozpracované", hot: fresh > 0},
    {n: open,  l: "V jednání", s: "otevřené příležitosti"},
    {n: soon,  l: "Schůzky", s: "příštích 7 dní"},
    {n: late,  l: "Po termínu", s: late ? "vyžaduje pozornost" : "nic nehoří", hot: late > 0},
    {n: won,   l: "Vyhráno", s: total ? Math.round(won/total*100) + " % z leadů" : ""}
  ];
  byId("kpis").innerHTML = tiles.map(function(t){
    return '<div class="kpi' + (t.hot ? " hot" : "") + '"><span class="n">' + t.n + '</span>' +
           '<span class="l">' + esc(t.l) + '</span><span class="s">' + esc(t.s || "") + '</span></div>';

/* ---------- import ze Shoptetu ----------
   Export je po položkách: víc řádků sdílí stejné číslo dokladu. */
function parseCsv(text, sep){
  text = String(text).replace(/^\uFEFF/, "");
  var rows = [], row = [], cur = "", q = false, i = 0;
  while(i < text.length){
    var ch = text.charAt(i);
    if(q){
      if(ch === '"'){
        if(text.charAt(i + 1) === '"'){ cur += '"'; i += 2; continue; }
        q = false; i++; continue;
      }
      cur += ch; i++; continue;
    }
    if(ch === '"'){ q = true; i++; continue; }
    if(ch === sep){ row.push(cur); cur = ""; i++; continue; }
    if(ch === "\r"){ i++; continue; }
    if(ch === "\n"){ row.push(cur); rows.push(row); row = []; cur = ""; i++; continue; }
    cur += ch; i++;
  }
  if(cur !== "" || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(function(r){ return r.length > 1 || (r[0] || "").trim() !== ""; });
}
function csvNum(x){
  var t = String(x == null ? "" : x).replace(/\s|\u00a0/g, "").replace(",", ".");
  var v = parseFloat(t);
  return isNaN(v) ? 0 : v;
}
function importShoptet(text){
  var rows = parseCsv(text, ";");
  if(rows.length < 2) return {added:0, skipped:0, err:"Soubor neobsahuje žádné řádky."};
  var head = rows[0].map(function(h){ return String(h).trim(); });
  var ix = {};
  head.forEach(function(h, i){ ix[h] = i; });
  if(ix.code == null || ix.itemName == null) return {added:0, skipped:0, err:"Tohle nevypadá jako export objednávek ze Shoptetu — chybí sloupce code a itemName."};
  var g = function(r, k){ return ix[k] == null ? "" : String(r[ix[k]] == null ? "" : r[ix[k]]).trim(); };
  var groups = {}, order = [];
  for(var i = 1; i < rows.length; i++){
    var r = rows[i], code = g(r, "code");
    if(!code) continue;
    if(!groups[code]){ groups[code] = []; order.push(code); }
    groups[code].push(r);
  }
  var have = {}, cts = [], ctSeen = {};
  (state.invoices || []).forEach(function(x){ have[x.number] = 1; });
  var out = [], skipped = 0;
  order.forEach(function(code){
    if(have[code]){ skipped++; return; }
    var gr = groups[code], h = gr[0];
    var date = g(h, "date").slice(0, 10) || isoDate(new Date());
    var status = g(h, "statusName");
    var items = gr.map(function(r){
      /* Sleva je v Shoptetu už promítnutá v discount sloupci — bereme ji,
         aby součty seděly na korunu. */
      var list = csvNum(g(r, "itemUnitPriceWithoutVat"));
      var net  = csvNum(g(r, "itemUnitDiscountPriceWithoutVat"));
      var unit = (net && Math.abs(net - list) > 0.005) ? net : list;
      var disc = (list && unit < list) ? Math.round((1 - unit / list) * 10000) / 100 : 0;
      return {
        name: g(r, "itemName"), code: g(r, "itemCode"),
        qty: csvNum(g(r, "itemAmount")) || 1,
        unit: g(r, "itemUnit") || "ks",
        price: list || unit, disc: disc,
        dph: csvNum(g(r, "itemVatRate"))
      };
    });
    var street = [g(h, "billStreet"), g(h, "billHouseNumber")].filter(Boolean).join(" ");
    var ctName = g(h, "billFullName") || g(h, "billCompany");
    var ctKey = ctName.toLowerCase() + "|" + g(h, "billCity").toLowerCase();
    if(ctName && !ctSeen[ctKey] && (g(h, "email") || g(h, "phone"))){
      ctSeen[ctKey] = 1;
      cts.push({name: ctName, city: g(h, "billCity"), street: street, zip: g(h, "billZip"),
                ico: g(h, "companyId"), email: g(h, "email"), phone: g(h, "phone"), source: "Shoptet"});
    }
    out.push({
      id: uid(), type: "faktura", number: code,
      leadId: null, issued: date, due: date, taxDate: date,
      payment: g(h, "paid") === "1" ? "Převodem" : "Převodem",
      pdp: false,
      customer: {
        name: g(h, "billFullName") || g(h, "billCompany"),
        street: street, zip: g(h, "billZip"), city: g(h, "billCity"),
        country: g(h, "billCountryName") || "Česká republika",
        ico: g(h, "companyId"), dic: g(h, "vatId"),
        email: g(h, "email"), tel: g(h, "phone")
      },
      items: items,
      note: g(h, "remark") || "",
      paid: g(h, "paid") === "1",
      paidAt: null,
      imported: true, source: "Shoptet", status: status,
      cancelled: /storn/i.test(status),
      saved: true, createdAt: nowISO(), by: ""
    });
  });
  return {added: out.length, skipped: skipped, invoices: out, contacts: cts};
}

/* ---------- import z Pohody (Stormware XML) ----------
   Sazbu DPH bereme z čísel (priceVAT/price), ne z enumu — sedí i historických 15 %. */
var NS_INV = "http://www.stormware.cz/schema/version_2/invoice.xsd";
var NS_TYP = "http://www.stormware.cz/schema/version_2/type.xsd";
function xText(el, ns, name){
  if(!el) return "";
  var n = el.getElementsByTagNameNS(ns, name);
  return n.length ? (n[0].textContent || "").trim() : "";
}
function xChildText(el, ns, name){
  if(!el) return "";
  for(var i = 0; i < el.childNodes.length; i++){
    var c = el.childNodes[i];
    if(c.nodeType === 1 && c.localName === name && c.namespaceURI === ns) return (c.textContent || "").trim();
  }
  return "";
}
var PAY_MAP = {cash:"Hotově", draft:"Převodem", creditcard:"Kartou", delivery:"Dobírkou", postal:"Převodem"};
function importPohoda(text){
  var doc = new DOMParser().parseFromString(text, "application/xml");
  if(doc.getElementsByTagName("parsererror").length) return {added:0, skipped:0, err:"XML se nepodařilo přečíst."};
  var list = doc.getElementsByTagNameNS(NS_INV, "invoice");
  if(!list.length) return {added:0, skipped:0, err:"V souboru nejsou žádné faktury (chybí inv:invoice)."};
  var have = {};
  (state.invoices || []).forEach(function(x){ have[x.number] = 1; });
  var out = [], skipped = 0;
  for(var i = 0; i < list.length; i++){
    var iv = list[i];
    var hEl = iv.getElementsByTagNameNS(NS_INV, "invoiceHeader")[0];
    if(!hEl) continue;
    var number = xText(hEl.getElementsByTagNameNS(NS_INV, "number")[0], NS_TYP, "numberRequested") ||
                 xChildText(hEl, NS_INV, "symVar");
    if(!number || have[number]){ skipped++; continue; }
    have[number] = 1;
    var payEl = hEl.getElementsByTagNameNS(NS_INV, "paymentType")[0];
    var payRaw = payEl ? xText(payEl, NS_TYP, "paymentType") : "";
    var addr = hEl.getElementsByTagNameNS(NS_TYP, "address")[0];
    var country = "";
    if(addr){
      var cn = addr.getElementsByTagNameNS(NS_TYP, "country")[0];
      country = cn ? xText(cn, NS_TYP, "ids") : "";
    }
    var issued = xChildText(hEl, NS_INV, "date") || isoDate(new Date());
    var items = [], itEls = iv.getElementsByTagNameNS(NS_INV, "invoiceItem");
    for(var j = 0; j < itEls.length; j++){
      var it = itEls[j];
      var hc = it.getElementsByTagNameNS(NS_INV, "homeCurrency")[0];
      var qty = parseFloat(xChildText(it, NS_INV, "quantity")) || 1;
      var base = parseFloat(xText(hc, NS_TYP, "price")) || 0;
      var vat  = parseFloat(xText(hc, NS_TYP, "priceVAT")) || 0;
      var unit = parseFloat(xText(hc, NS_TYP, "unitPrice"));
      /* Jednotkovou cenu dopočítáme ze základu, aby součet seděl na haléř. */
      var perUnit = qty ? Math.round(base / qty * 10000) / 10000 : (isNaN(unit) ? 0 : unit);
      var rate = base ? Math.round(vat / base * 100) : 0;
      items.push({
        name: xChildText(it, NS_INV, "text"), code: xChildText(it, NS_INV, "code"),
        qty: qty, unit: xChildText(it, NS_INV, "unit") || "", price: perUnit, disc: 0, dph: rate
      });
    }
    out.push({
      id: uid(), type: "faktura", number: number, leadId: null,
      issued: issued,
      due: xChildText(hEl, NS_INV, "dateDue") || issued,
      taxDate: xChildText(hEl, NS_INV, "dateTax") || issued,
      payment: PAY_MAP[payRaw] || "Převodem",
      pdp: false,
      customer: {
        name: (addr ? xChildText(addr, NS_TYP, "name") : "") || (addr ? xChildText(addr, NS_TYP, "company") : ""),
        street: addr ? xChildText(addr, NS_TYP, "street") : "",
        zip: addr ? xChildText(addr, NS_TYP, "zip") : "",
        city: addr ? xChildText(addr, NS_TYP, "city") : "",
        country: country === "CZ" ? "Česká republika" : (country || "Česká republika"),
        ico: addr ? xChildText(addr, NS_TYP, "ico") : "",
        dic: addr ? xChildText(addr, NS_TYP, "dic") : "",
        email: "", tel: ""
      },
      items: items,
      note: xChildText(hEl, NS_INV, "intNote") || "",
      paid: false, paidAt: null,
      imported: true, source: "Pohoda", status: "",
      cancelled: false, saved: true, createdAt: nowISO(), by: ""
    });
  }
  return {added: out.length, skipped: skipped, invoices: out};
}
function importAny(text, filename){
  var t = String(text || "");
  if(/^\s*<\?xml|<dat:dataPack|stormware/i.test(t.slice(0, 400))) return importPohoda(t);
  if(/"?code"?;|itemName/i.test(t.slice(0, 800))) return importShoptet(t);
  return {added:0, skipped:0, err:"Formát souboru nepoznávám — čekám XML z Pohody nebo CSV export objednávek ze Shoptetu."};
}

function captureInvoice(){
  var inv = invDraft; if(!inv) return null;
  var g = function(id){ var e = byId(id); return e ? e.value : ""; };
  inv.customer = inv.customer || {};
  inv.customer.name = g("cuName"); inv.customer.street = g("cuStreet");
  inv.customer.zip = g("cuZip"); inv.customer.city = g("cuCity");
  inv.customer.ico = g("cuIco"); inv.customer.dic = g("cuDic");
  if(g("ivIssued")) inv.issued = g("ivIssued");
  if(g("ivDue")) inv.due = g("ivDue");
  if(g("ivTax")) inv.taxDate = g("ivTax");
  inv.payment = g("ivPay") || inv.payment;
  inv.note = g("ivNote");
  var pdpEl = byId("ivPdp"); if(pdpEl) inv.pdp = pdpEl.checked;
  var trs = document.querySelectorAll("#view .invitems tbody tr");
  for(var i = 0; i < trs.length; i++){
    var it = inv.items[i]; if(!it) continue;
    var fs = trs[i].querySelectorAll("[data-f]");
    for(var j = 0; j < fs.length; j++){
      var f = fs[j].getAttribute("data-f"), v = fs[j].value;
      it[f] = (f === "qty" || f === "price" || f === "disc" || f === "dph") ? (Number(v) || 0) : v;
    }
  }
  return inv;
}

function applyOp(p){
  if(p.t === "tpl"){ state.template = p.v; return; }
  if(p.t === "cfg"){
    if(p.v.template) state.template = p.v.template;
    if(p.v.company) state.company = p.v.company;
    if(p.v.series) state.series = p.v.series;
    if(p.v.pricelist) state.pricelist = p.v.pricelist;
    return;
  }
  if(p.t === "inv"){
    if(!state.invoices) state.invoices = [];
    var found = -1;
    for(var q = 0; q < state.invoices.length; q++) if(state.invoices[q].id === p.v.id) found = q;
    if(found >= 0) state.invoices[found] = p.v; else state.invoices.push(p.v);
    if(p.series) state.series = p.series;
    return;
  }
  if(p.t === "invMany"){
    if(!state.invoices) state.invoices = [];
    var seen = {};
    state.invoices.forEach(function(x){ seen[x.number] = 1; });
    (p.v || []).forEach(function(x){ if(!seen[x.number]) state.invoices.push(x); });
    if(p.contacts && p.contacts.length){
      if(!state.contacts) state.contacts = [];
      var ck = {};
      state.contacts.forEach(function(x){ ck[(x.name || "").toLowerCase() + "|" + (x.city || "").toLowerCase()] = 1; });
      p.contacts.forEach(function(x){
        var k = (x.name || "").toLowerCase() + "|" + (x.city || "").toLowerCase();
        if(!ck[k]){ ck[k] = 1; state.contacts.push(x); }
      });
    }
    return;
  }
  if(p.t === "real"){
    if(!state.realizace) state.realizace = [];
    var fr = -1;
    for(var q2 = 0; q2 < state.realizace.length; q2++) if(state.realizace[q2].id === p.v.id) fr = q2;
    if(fr >= 0) state.realizace[fr] = p.v; else state.realizace.push(p.v);
    return;
  }
  if(p.t === "realDel"){ state.realizace = (state.realizace || []).filter(function(x){ return x.id !== p.v; }); return; }
  if(p.t === "note"){
    if(!state.notes) state.notes = [];
    if(!state.notes.some(function(x){ return x.id === p.v.id; })) state.notes.push(p.v);
    return;
  }
  if(p.t === "noteDel"){ state.notes = (state.notes || []).filter(function(x){ return x.id !== p.v; }); return; }
  if(p.t === "ev"){
    if(!state.events) state.events = [];
    var fe = -1;
    for(var q3 = 0; q3 < state.events.length; q3++) if(state.events[q3].id === p.v.id) fe = q3;
    if(fe >= 0) state.events[fe] = p.v; else state.events.push(p.v);
    return;
  }
  if(p.t === "evDel"){ state.events = (state.events || []).filter(function(x){ return x.id !== p.v; }); return; }
  if(p.t === "pl"){ state.pricelist = p.v; return; }
  if(p.t === "invDel"){
    state.invoices = (state.invoices || []).filter(function(x){ return x.id !== p.v; });
    return;
  }
  var o = ovWrite(p.id);
  if(p.t === "set"){ o[p.k] = p.v; }
  else if(p.t === "cmt"){ if(!o.comments.some(function(c){ return c.id === p.c.id; })) o.comments.push(p.c); }
  else if(p.t === "cmt-"){ o.comments = o.comments.filter(function(c){ return c.id !== p.v; }); }
  else if(p.t === "meet"){
    var ex = null;
    o.meetings.forEach(function(m){ if(m.id === p.m.id) ex = m; });
    if(ex){ Object.keys(p.m).forEach(function(k){ ex[k] = p.m[k]; }); } else { o.meetings.push(p.m); }
  }
  else if(p.t === "meet-"){ o.meetings = o.meetings.filter(function(m){ return m.id !== p.v; }); }
}
function doOp(p){
  applyOp(p); pending.push(p); stash();
  state.updatedAt = nowISO();

  scheduleSave();
}

}

/* ---------- pohled Faktury ---------- */
function periodRange(key){
  var now = new Date(), y = now.getFullYear(), m = now.getMonth();
  if(key === "month")  return [isoDate(new Date(y, m, 1)), isoDate(new Date(y, m + 1, 0))];
  if(key === "prev")   return [isoDate(new Date(y, m - 1, 1)), isoDate(new Date(y, m, 0))];
  if(key === "year")   return [y + "-01-01", y + "-12-31"];
  return null;
}
function invRows(){
  var q = ui.q.trim().toLowerCase();
  var list = (state.invoices || []).slice();
  if(ui.view === "fakturace.zalohy") list = list.filter(function(x){ return x.type === "zaloha"; });
  else if(ui.view === "fakturace.faktury") list = list.filter(function(x){ return x.type !== "zaloha"; });
  var rng = periodRange(ui.invPeriod || "");
  if(rng) list = list.filter(function(x){ return x.issued >= rng[0] && x.issued <= rng[1]; });
  if(q) list = list.filter(function(x){
    return (x.number + " " + ((x.customer || {}).name || "") + " " + ((x.customer || {}).city || "")).toLowerCase().indexOf(q) >= 0;
  });
  list.sort(function(a, b){ return a.issued < b.issued ? 1 : (a.issued > b.issued ? -1 : 0); });
  return list;
}

/* ---------- databáze klientů (odvozená z dokladů) ---------- */
function normPhone(p){
  var t = String(p || "").replace(/[^0-9]/g, "");
  if(t.length > 9) t = t.slice(-9);
  return t;
}
function normName(n){
  return String(n || "").toLowerCase().replace(/\s+/g, " ").trim()
    .replace(/\s*(s\.r\.o\.|a\.s\.|spol\. s r\.o\.)\s*$/i, "").trim();
}
function clientKey(cu){
  if(cu.ico) return "ico:" + String(cu.ico).replace(/\s/g, "");
  return "nm:" + normName(cu.name) + "|" + String(cu.city || "").toLowerCase().trim();
}
function buildClients(){
  var map = {}, list = [];
  (state.invoices || []).forEach(function(inv){
    var cu = inv.customer || {};
    if(!cu.name && !cu.ico) return;
    var key = clientKey(cu);
    var c = map[key];
    if(!c){
      c = map[key] = {key:key, name:cu.name || "", street:cu.street || "", zip:cu.zip || "",
                      city:cu.city || "", ico:cu.ico || "", dic:cu.dic || "",
                      emails:[], phones:[], docs:[], total:0, last:""};
      list.push(c);
    }
    if(!c.street && cu.street) c.street = cu.street;
    if(!c.zip && cu.zip) c.zip = cu.zip;
    if(!c.city && cu.city) c.city = cu.city;
    if(!c.ico && cu.ico) c.ico = cu.ico;
    if(!c.dic && cu.dic) c.dic = cu.dic;
    if(cu.email && c.emails.indexOf(cu.email) < 0) c.emails.push(cu.email);
    if(cu.tel && c.phones.indexOf(cu.tel) < 0) c.phones.push(cu.tel);
    c.docs.push(inv);
    if(!inv.cancelled) c.total += calcDoc(inv).total;
    if(inv.issued > c.last) c.last = inv.issued;
  });
  /* Doplnění kontaktů z leadů — spárováno přes e-mail, telefon nebo jméno + město. */
  var rows = baseRows(), byMail = {}, byPhone = {}, byName = {};
  rows.forEach(function(r){
    if(r.email) byMail[r.email.toLowerCase()] = r;
    if(r.phone) byPhone[normPhone(r.phone)] = r;
    byName[normName(r.name) + "|" + String(r.city || "").toLowerCase().trim()] = r;
  });
  list.forEach(function(c){
    var hit = null;
    c.emails.forEach(function(e){ if(!hit && byMail[e.toLowerCase()]) hit = byMail[e.toLowerCase()]; });
    c.phones.forEach(function(p){ if(!hit && byPhone[normPhone(p)]) hit = byPhone[normPhone(p)]; });
    if(!hit) hit = byName[normName(c.name) + "|" + String(c.city || "").toLowerCase().trim()];
    if(hit){
      c.leadId = hit.id;
      if(hit.email && c.emails.indexOf(hit.email) < 0) c.emails.push(hit.email);
      if(hit.phone && c.phones.indexOf(hit.phone) < 0) c.phones.push(hit.phone);
    }
  });
  var cts = state.contacts || [];
  list.forEach(function(c){
    cts.forEach(function(ct){
      var sameIco = ct.ico && c.ico && String(ct.ico) === String(c.ico);
      var sameNm = normName(ct.name) === normName(c.name) &&
        (!ct.city || !c.city || String(ct.city).toLowerCase().trim() === String(c.city).toLowerCase().trim());
      if(!sameIco && !sameNm) return;
      if(ct.email && c.emails.indexOf(ct.email) < 0) c.emails.push(ct.email);
      if(ct.phone && c.phones.indexOf(ct.phone) < 0) c.phones.push(ct.phone);
      if(!c.street && ct.street) c.street = ct.street;
      if(!c.zip && ct.zip) c.zip = ct.zip;
    });
  });
  list.sort(function(a, b){ return b.total - a.total; });
  return list;
}
function clientsFiltered(){
  var q = ui.q.trim().toLowerCase();
  var list = buildClients();
  if(q) list = list.filter(function(c){

function calEvents(){
  var out = [];
  baseRows().forEach(function(r){
    var o = ovRead(r.id);
    (o.meetings || []).forEach(function(m){
      if(!m.at) return;
      out.push({id: m.id, at: String(m.at).slice(0, 10), time: String(m.at).slice(11, 16),
                kind: "Schůzka", title: r.name, note: [m.place, m.note].filter(Boolean).join(" · "),
                leadId: r.id, done: !!m.done, iso: m.at, place: m.place || ""});
    });
    if(dueDate(o)) out.push({id: "t" + r.id, at: o.next.date, time: "", kind: "Úkol",
                title: r.name, note: o.next.text || "Ozvat se", leadId: r.id, done: false,
                iso: o.next.date + "T09:00", place: ""});
  });
  (state.events || []).forEach(function(e){
    if(!e.at) return;
    out.push({id: e.id, at: String(e.at).slice(0, 10), time: String(e.at).slice(11, 16),
              kind: e.kind || "Událost", title: e.title || "Událost", note: e.note || "",
              leadId: e.leadId || null, done: !!e.done, iso: e.at, own: true, place: e.place || ""});
  });
  (state.realizace || []).forEach(function(z){
    if(!z.date) return;
    out.push({id: "r" + z.id, at: z.date, time: "", kind: "Montáž",
              title: z.client || z.title || "Realizace", note: z.address || "",
              realizaceId: z.id, done: false, iso: z.date + "T08:00", place: z.address || ""});
  });
  out.sort(function(a, b){ return a.iso < b.iso ? -1 : (a.iso > b.iso ? 1 : 0); });
  return out;
}
function gcalUrl(ev){
  var st = new Date(ev.iso);
  if(isNaN(st)) return "";
  var en = new Date(st.getTime() + 60 * 60000);
  var f = function(d){ return d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, ""); };
  return "https://calendar.google.com/calendar/render?action=TEMPLATE" +
    "&text=" + encodeURIComponent(ev.kind + ": " + ev.title) +
    "&dates=" + f(st) + "/" + f(en) +
    "&details=" + encodeURIComponent(ev.note || "") +
    "&location=" + encodeURIComponent(ev.place || "");
}

        "</div>";

/* ---------- soubory z Google Drivu ---------- */
var DRIVE_CACHE = {}, DRIVE_STATE = {};
function folderIdFrom(url){
  var m = String(url || "").match(/folders\/([A-Za-z0-9_-]{10,})/);
  if(m) return m[1];
  m = String(url || "").match(/^[A-Za-z0-9_-]{10,}$/);
  return m ? m[0] : "";
}
function driveList(folderId, done){
  if(!folderId) return done({err: "Chybí odkaz na složku."});
  if(DRIVE_CACHE[folderId]) return done({files: DRIVE_CACHE[folderId]});
  if(!MCP) return done({err: "Konektor Google Drive tady není dostupný."});
  DRIVE_STATE[folderId] = "load";
  MCP.callTool(SERVER, "search_files",
      {query: "parentId = '" + folderId + "'", pageSize: 100, excludeContentSnippets: true},
      {cache: {staleTime: 300000}})
    .then(function(res){
      var pl = res && res.payload;
      var files = (pl && pl.files) || [];
      DRIVE_CACHE[folderId] = files;
      DRIVE_STATE[folderId] = "ok";
      done({files: files});
    })
    .catch(function(e){
      DRIVE_STATE[folderId] = "err";
      var c = e && e.code;
      done({err: c === "needs_reauth" ? "Připojení ke Google Drive vypršelo — obnov ho v Nastavení → Konektory."
        : c === "server_not_connected" ? "Konektor Google Drive není připojený."
        : "Složku se nepodařilo načíst (" + (c || "chyba") + ")."});
    });
}
function fileRowsHTML(files){
  return files.map(function(f){
    var kb = f.fileSize ? Math.round(Number(f.fileSize) / 1024) : 0;
    var isImg = /^image\//.test(f.mimeType || "");
    return '<div class="filerow">' +

var ART = null, DL = null, MCP = null;
/* Celá kostra včetně překryvů — zachyceno před prvním vykreslením. */
var SHELL = byId("app").outerHTML;
var mode = "auto", saving = false, dirty = false, saveTimer = null, readOnly = false, retried = false;

function buildDoc(json){

function scheduleSave(){
  if(readOnly) return;
  dirty = true; setSync(byId("syncBtn").dataset.s, "Ukládám…");
  clearTimeout(saveTimer); saveTimer = setTimeout(doSave, 2500);
}
function doSave(){
  if(saving || !dirty) return;
  if(!ART){ setSync("err", "Neuloženo — jen v prohlížeči"); return; }
  saving = true; dirty = false;
  state.rev = (state.rev || 0) + 1;
  state.updatedAt = nowISO();
  /* Sjednocení, ne nahrazení: neúplné načtení nesmí zmenšit uloženou kopii
     a lead smazaný z tabulky nesmí zmizet z rozpracované práce. */
  var merged = baseRows();
  if(merged.length) state.snapshot = {rows: merged, fetchedAt: syncAt || Date.now()};
  var json = JSON.stringify(state);
  keepPlace();
  var attempt = (mode === "html")
    ? Promise.reject({code:"__toHtml"})
    : ART.publish({"data/crm.json": {content: json, contentType:"application/json"}}).then(function(){ mode = "files"; });
  attempt.catch(function(e){
    var c = e && e.code;
    if(c === "__toHtml" || c === "capability_disabled" || c === "capability_removed" ||
       c === "read_only_path" || c === "bad_request" || c === "transform_error"){
      mode = "html";
      return ART.publish(buildDoc(json));
    }
    throw e;
  }).then(function(){
    saving = false; retried = false;
    pending = []; stash();
    setBanner("new", null, null);
    setSync(syncErr ? "err" : "ok", syncLabel());
  }).catch(function(e){
    saving = false;
    onSaveError(e);
  });
}
/* Uložení celé stránky ji znovu načte — držíme si otevřený lead, rozepsanou
   poznámku i pozici posuvníku, aby na tom nebylo nic znát. */
function keepPlace(){
  try{
    var body = document.querySelector("#drawer .dr-body");
    sessionStorage.setItem("reo.place", JSON.stringify({
      ts: Date.now(), openId: ui.openId, view: ui.view,
      y: window.scrollY || 0, dy: body ? body.scrollTop : 0, drafts: drafts
    }));
  }catch(e){}
}
function restorePlace(){
  var p = null;
  try{
    p = JSON.parse(sessionStorage.getItem("reo.place") || "null");
    sessionStorage.removeItem("reo.place");
  }catch(e){}
  if(!p || (Date.now() - (p.ts || 0)) > 60000) return;
  if(p.drafts) drafts = p.drafts;
  if(p.view && p.view !== ui.view){ ui.view = p.view; renderAll(); }
  if(p.y) window.scrollTo(0, p.y);
  if(p.openId && findRow(p.openId)){
    openLead(p.openId);
    var body = document.querySelector("#drawer .dr-body");
    if(body && p.dy) body.scrollTop = p.dy;
  }
}
function onSaveError(e){
  var c = (e && e.code) || "upstream_error";
  if(c === "conflict"){
    keepPlace();
    setSync("load", "Načítám novější verzi…");
    toast("Někdo jiný mezitím uložil změnu — načítám aktuální verzi.");
    return;                       /* pending zůstává v sessionStorage, po reloadu se dohraje */
  }
  if(c === "not_writer" || c === "not_granted" || c === "not_declared" || c === "consent_required"){
    readOnly = true;
    setSync("err", "Jen ke čtení");
    setBanner("ro", "warn", "Tenhle pohled je jen ke čtení — změny se neuloží. Otevři dokument pod účtem, který ho vlastní, nebo si vyžádej právo k úpravám.");
    return;
  }
  if(c === "too_large"){
    setBanner("size", "warn", "Dokument je moc velký na uložení. Archivuj staré leady nebo zkrať poznámky.");
    setSync("err", "Neuloženo"); return;
  }
  if(c === "rate_limited"){
    setSync("load", "Ukládání zpomaleno");
    dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(doSave, 15000); return;
  }
  setSync("err", "Uložení selhalo");
  if(!retried){ retried = true; dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(doSave, 4000); }
  else { toast("Změny se nepodařilo uložit. Zůstávají v tomhle okně — zkus to znovu tlačítkem u stavu."); }
}

function useCap(n){
  try{
    if(window.claude && typeof window.claude.use === "function") return window.claude.use(n);
  }catch(e){}

function payloadText(res){
  var pl = res && res.payload;
  if(pl && typeof pl === "object" && pl.fileContent != null) return String(pl.fileContent);
  if(typeof pl === "string") return pl;
  var blocks = (res && res.content) || [];
  for(var i=0;i<blocks.length;i++){
    if(blocks[i] && blocks[i].type === "text" && blocks[i].text){
      try{ var j = JSON.parse(blocks[i].text); if(j && j.fileContent != null) return String(j.fileContent); }catch(e){}
      return blocks[i].text;
    }
  }
  return "";
}
function startSync(){
  if(!MCP){
    setSync("err", "Bez konektoru");
    setBanner("mcp", "warn", "Tenhle pohled nemá přístup ke konektorům, takže se leady z tabulky nenačtou. Zobrazuji poslední kopii uloženou v dokumentu.");
    renderAll(); return;
  }
  fetchLeads(false);
  setInterval(function(){ if(!document.hidden && !saving) fetchLeads(false); }, 300000);
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden && syncAt && (Date.now() - syncAt) > 300000) fetchLeads(false);
  });
}
function fetchLeads(force){
  if(!MCP) return Promise.resolve();
  setSync("load", "Načítám leady…");
  return MCP.callTool(SERVER, TOOL_XLSX, {fileId: SHEET_ID, exportMimeType: XLSX_MIME},
      {cache:{staleTime:120000, gcTime:600000, refresh: !!force}})
    .then(function(res){
      var pl = res && res.payload, b64 = pl && (pl.content || pl.data);
      if(!b64) throw {code:"tool_error", message:"Google Drive nevrátil obsah sešitu."};
      return parseWorkbook(b64bytes(b64)).then(function(sheets){
        var rows = leadsFromWorkbook(sheets);
        if(!rows.length) throw {code:"tool_error", message:"V sešitu se nenašly žádné řádky s leady."};
        setBanner("trunc", null, null);
        onLeads(rows, res);
      });
    })
    .catch(function(e){
      var c = e && e.code;
      /* Na těchto chybách nepomůže ani druhý způsob čtení — konektor je prostě nedostupný. */
      if(c && HARD_ERRORS.indexOf(c) >= 0){ onSheetError(e); return; }
      return fetchFallback(e);
    });
}
var HARD_ERRORS = ["needs_reauth","server_not_connected","selection_required","blocked_by_policy",
                   "approval_required","not_in_manifest","not_granted","capability_disabled","capability_removed"];
/* Když prohlížeč neumí rozbalit zip, čteme tabulku postaru — konektor ji ale ořezává. */
function fetchFallback(err){
  var why = (err && err.message) || "";
  return MCP.callTool(SERVER, TOOL_MD, {fileId: SHEET_ID}, {cache:{staleTime:120000}})
    .then(function(res){
      var rows = parseSheet(payloadText(res));
      if(!rows.length) throw {code:"tool_error", message:"V tabulce se nenašly žádné řádky s leady."};
      onLeads(rows, res);
      setBanner("trunc", "warn", why === "nodecomp"
        ? "Tenhle prohlížeč neumí rozbalit sešit, takže se načetla jen část leadů. Otevři dokument v Chrome, Edge nebo Safari 16.4+."
        : "Sešit se nepodařilo přečíst celý — načetl se jen jeho začátek, novější leady můžou chybět.");
    })
    .catch(function(e){
      onSheetError(e && e.code ? e : (err && err.code ? err : {code:"upstream_error"}));
    });
}
function onLeads(rows, res){
  live = rows;
  syncErr = null;
  syncAt = (res && res.cache && res.cache.storedAt) ? res.cache.storedAt : Date.now();
  setBanner("mcp", null, null);
  setSync("ok", syncLabel());
  var known = {}, snap = (state.snapshot && state.snapshot.rows) || [];
  snap.forEach(function(x){ known[x.id] = 1; });
  var arrived = rows.filter(function(r){ return !known[r.id] && !state.leads[r.id]; }).length;
  if(arrived && snap.length){
    setBanner("new", "info", arrived === 1 ? "Z tabulky přibyl 1 nový lead."
      : "Z tabulky přibylo " + arrived + " nových leadů.", "Uložit do dokumentu");
  } else if(arrived){
    setBanner("new", "info", "Načteno " + arrived + " leadů ze všech listů tabulky. Zatím nejsou uložené v dokumentu.", "Uložit do dokumentu");
  } else {
    setBanner("new", null, null);
  }
  renderAll();
}
function onSheetError(err){
  var c = (err && err.code) || "upstream_error";
  syncErr = c;
  var hard = HARD_ERRORS;
  if(hard.indexOf(c) >= 0) live = null;      /* data z konektoru stahujeme, zůstane uložená kopie */
  var msg;
  if(c === "needs_reauth")            msg = "Připojení ke Google Drive vypršelo. Obnov ho v claude.ai → Nastavení → Konektory a stránku načti znovu.";
  else if(c === "server_not_connected") msg = "Konektor Google Drive není připojený. Přidej ho v claude.ai → Nastavení → Konektory.";
  else if(c === "selection_required") msg = "Máš víc připojení Google Drive. Vyber jedno v claude.ai a načti stránku znovu.";
  else if(c === "blocked_by_policy")  msg = "Pravidla organizace nedovolují číst Google Drive z této stránky.";
  else if(c === "approval_required")  msg = "Čtení Google Drive vyžaduje schválení, které tady nejde udělit.";
  else if(c === "not_granted" || c === "capability_disabled" || c === "capability_removed")
                                      msg = "Tenhle pohled nemá přístup ke konektorům. Zobrazuji poslední kopii uloženou v dokumentu.";
  else if(c === "tool_error")         msg = "Google Drive tabulku nevrátil: " + ((err && err.message) || "neznámá chyba") + " Zkontroluj, že k ní má účet přístup.";
  else if(c === "server_unavailable") msg = "Google Drive teď neodpovídá. Zkusím to znovu za chvíli — zatím pracuješ s poslední načtenou verzí.";
  else                                msg = "Leady se nepodařilo načíst (" + c + "). Pracuješ s poslední uloženou kopií.";
  setBanner("mcp", hard.indexOf(c) >= 0 ? "warn" : "info", msg, "Zkusit znovu");
  setSync("err", syncLabel());
  renderAll();
}
function refetch(){
  if(!MCP) return;
  var p = MCP.invalidate ? MCP.invalidate(SERVER) : Promise.resolve();
  p.catch(function(){}).then(function(){ return fetchLeads(true); });
}

/* ---------- export ---------- */
function csvCell(v){ return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'; }
function exportCsv(){
  var rows = filtered();
  var head = ["Jméno","Telefon","E-mail","Město","Segment","Stav","Majitel","Priorita","Další krok",
              "Termín kroku","Nejbližší schůzka","Poznámek","Poslední poznámka","Poznámka z tabulky (U)",
              "Topí","Náklady","Termín realizace","Obsluhovaná oblast","Nabídka odeslána",
              "Formulář","Kampaň","Přijato","ID"];
  var body = rows.map(function(r){
    var o = ovRead(r.id), m = nextMeeting(o), last = (o.comments||[]).slice(-1)[0];
    return [r.name, r.phone, r.email, r.city, r.segment === "partner" ? "Partner" : "Zákazník",
      stageLabel(o.stage, r.segment), o.owner, [ "Normální","Nízká","Horký" ][Number(o.prio||0)] || "Normální",
      (o.next && o.next.text) || "", (o.next && o.next.date) || "",
      m ? (fmtShort(new Date(m.at)) + " " + fmtTime(new Date(m.at)) + (m.place ? " · " + m.place : "")) : "",
      commentCount(o), last ? last.text : "", r.note || "",
      heatOf(r), costOf(r), whenOf(r), pRegion(r),
      (o.offer && o.offer.at) ? fmtShort(new Date(o.offer.at)) : "", r.form, r.campaign,
      fmtShort(new Date(r.createdMs)), r.id].map(csvCell).join(";");
  });
  var csv = "﻿" + head.map(csvCell).join(";") + "\n" + body.join("\n");
  var name = "reo-leady-" + dayKey(new Date()) + ".csv";
  if(DL){
    DL.save({filename:name, data:csv}).then(function(){ toast("Uloženo jako " + name); })
      .catch(function(e){
        var c = e && e.code;
        if(c === "declined") return;
        toast(c === "too_large" ? "Export je moc velký." : "Stažení tady není dostupné — zkopíruj data z tabulky.");
      });
  } else {
    toast("Stahování tady není dostupné. Otevři dokument v prohlížeči na claude.ai.");
  }
}
