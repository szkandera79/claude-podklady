<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Návrhy hero obrázku</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--brand:#34a263;--ink:#2d2f2e;--muted:#5f6662;--bg:#f6f9f7}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:32px 16px}
h1{font-size:1.8rem;max-width:1200px;margin:0 auto 6px}
p.lead{max-width:1200px;margin:0 auto 28px;color:var(--muted)}
.grid{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:22px}
figure{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(18,56,33,.08)}
figure img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block}
figcaption{padding:14px 18px 18px}
figcaption b{display:block;font-size:1.05rem;margin-bottom:4px}
figcaption span{color:var(--muted);font-size:.9rem}
.tag{display:inline-block;background:#e9f6ee;color:#1f4d33;font-weight:800;border-radius:8px;padding:2px 8px;margin-right:6px}
</style></head><body>
<h1>Návrhy hero obrázku – Eko4Home</h1>
<p class="lead">Stejná jednotka REO HEATING RH060 + zásobník Watertank, různé pozadí. Vyberte písmeno.</p>
<div class="grid">
<figure><img src="A-svetla-zelena.webp" alt=""><figcaption><b><span class="tag">A</span>Světlá zelená</b><span>Čisté pozadí v barvách webu, splývá s úvodem.</span></figcaption></figure>
<figure><img src="B-venku-uvnitr.webp" alt=""><figcaption><b><span class="tag">B</span>Venku / uvnitř</b><span>Zeď domu ukazuje, co je venku a co uvnitř – vysvětluje princip.</span></figcaption></figure>
<figure><img src="C-tmava-premiova.webp" alt=""><figcaption><b><span class="tag">C</span>Tmavá prémiová</b><span>Tmavě zelené studio s odrazem, výrazný kontrast.</span></figcaption></figure>
<figure><img src="D-slunicko.webp" alt=""><figcaption><b><span class="tag">D</span>Sluníčko</b><span>Teplé žluté světlo a slunce – navazuje na „topí ze sluníčka“.</span></figcaption></figure>
<figure><img src="E-bile-studio.webp" alt=""><figcaption><b><span class="tag">E</span>Bílé studio</b><span>Produktový styl s odrazem na podlaze, jako e-shop.</span></figcaption></figure>
<figure><img src="F-puvodni-foto.webp" alt=""><figcaption><b><span class="tag">F</span>Původní foto (aktuální)</b><span>Dřevo a beton ze screenu – realistické.</span></figcaption></figure>
<figure><img src="G-scena-domu.webp" alt=""><figcaption><b><span class="tag">G</span>Scéna domu</b><span>Zahrada, dům a koupelna se sprchou (dnes v sekci „Jak funguje“).</span></figcaption></figure>
</div></body></html>
