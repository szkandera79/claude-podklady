<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ThermaVera — náhled bannerů</title>
<style>
  :root{
    --green:#2E6B33; --green-bright:#5BA32E; --green-tint:#EAF4DE;
    --amber:#FCC83C; --ink:#16201C; --muted:#5F6B64; --bg:#FFFFFF; --bg-alt:#F5F9F1; --line:#E6EEE0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg-alt);line-height:1.5;padding:32px 20px 60px}
  header{max-width:1200px;margin:0 auto 28px}
  h1{font-family:"Poppins","Inter",sans-serif;font-size:1.7rem;letter-spacing:-.01em}
  .sub{color:var(--muted);margin-top:6px;font-size:.95rem}
  .legend{display:inline-block;background:var(--green-tint);color:var(--green);font-size:.8rem;font-weight:600;padding:4px 10px;border-radius:999px;margin-top:14px}
  .wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:36px}
  .concept{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:20px 22px 24px;box-shadow:0 10px 30px -22px rgba(22,32,28,.4)}
  .chead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
  .badge{font-family:"Poppins";font-weight:700;font-size:.8rem;color:#fff;background:var(--green);border-radius:8px;padding:3px 9px}
  .ctitle{font-family:"Poppins";font-weight:700;font-size:1.15rem}
  .cdesc{color:var(--muted);font-size:.9rem;margin-bottom:16px}
  .formats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  @media(max-width:820px){.formats{grid-template-columns:1fr}}
  .fmt{display:flex;flex-direction:column;gap:8px}
  .flabel{font-size:.78rem;font-weight:600;color:var(--green-bright);text-transform:uppercase;letter-spacing:.08em}
  .fmt img{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);background:#fff;display:block}
  footer{max-width:1200px;margin:40px auto 0;color:var(--muted);font-size:.82rem;text-align:center}
</style>
</head>
<body>
<header>
  <h1>ThermaVera Energy — náhled bannerů</h1>
  <p class="sub">6 konceptů × 3 formáty (1080×1080 · 1080×1920 · 1080×1350). Barvy dle živého webu thermavera.cz.</p>
  <span class="legend">Generováno přes Gemini · zdroj: configs/thermavera.ts</span>
</header>
<div class="wrap" id="wrap"></div>
<footer>Náhled — soubory leží ve stejné složce. Pro export do reklam použij přímo PNG.</footer>
<script>
  const concepts = [
    {id:'K1', slug:'koncept_1_kotelna', title:'Kotelna (realistická scéna)', desc:'Vnitřní kotelna · headline = brand claim · návratnost do 7 let'},
    {id:'K2', slug:'koncept_2_bytovy_dum', title:'Bytový dům / SVJ', desc:'Exteriér s venkovními jednotkami · nezávislost na dodavateli tepla'},
    {id:'K3', slug:'koncept_3_kombinace', title:'Kombinace zdrojů', desc:'Infografika · tepelné čerpadlo + biomasa + akumulace'},
    {id:'K4', slug:'koncept_4_modelovy_scenar', title:'Modelový scénář', desc:'Karta · orientační návratnost · právně označeno'},
    {id:'K5', slug:'koncept_5_ets2', title:'ETS2 / ceny paliv', desc:'Graf trendu · méně závislí na cenách paliv'},
    {id:'K6', slug:'koncept_6_typo', title:'Typografie (claim)', desc:'Brand claim · always-on kreativa'},
  ];
  const formats = [
    {suffix:'1080x1080', label:'Feed 1:1'},
    {suffix:'1080x1350', label:'Na výšku 4:5'},
    {suffix:'1080x1920', label:'Stories 9:16'},
  ];
  const wrap = document.getElementById('wrap');
  for(const c of concepts){
    const el = document.createElement('div'); el.className='concept';
    let fmts = '';
    for(const f of formats){
      fmts += `<div class="fmt"><span class="flabel">${f.label}</span>`
            + `<img loading="lazy" src="./${c.slug}_banner_${f.suffix}.png" alt="${c.id} ${f.label}"></div>`;
    }
    el.innerHTML = `<div class="chead"><span class="badge">${c.id}</span><span class="ctitle">${c.title}</span></div>`
                 + `<div class="cdesc">${c.desc}</div><div class="formats">${fmts}</div>`;
    wrap.appendChild(el);
  }
</script>
</body>
</html>
